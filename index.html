/* =========================================================
   Звук. Всё генерируется в браузере, без файлов:
   тёмный гул и треск свечей фоном, сердцебиение при запрете,
   короткие акценты на раздаче, открытии карты, наказании и паузе.
   ========================================================= */
const Sound = (() => {
  let ctx=null, master, music, sfx, NB, started=false;
  let on = store.get('uzel-game-sound'); if(on===null) on=true;
  const L={}; let heartOn=false, heartRate=1.2;
  const now=()=>ctx.currentTime;
  function impulse(sec){ const len=ctx.sampleRate*sec, b=ctx.createBuffer(2,len,ctx.sampleRate); for(let c=0;c<2;c++){ const d=b.getChannelData(c); for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6); } return b; }
  function brown(){ const len=ctx.sampleRate*3, b=ctx.createBuffer(1,len,ctx.sampleRate), d=b.getChannelData(0); let last=0; for(let i=0;i<len;i++){ const w=Math.random()*2-1; last=(last+0.02*w)/1.02; d[i]=last*3.5; } return b; }
  function ramp(p,v,t){ p.cancelScheduledValues(now()); p.setValueAtTime(p.value,now()); p.linearRampToValueAtTime(v,now()+t); }
  function init(){
    ctx=new (window.AudioContext||window.webkitAudioContext)(); NB=brown();
    master=ctx.createGain(); master.gain.value=on?.9:0; master.connect(ctx.destination);
    const rev=ctx.createConvolver(); rev.buffer=impulse(3); const rg=ctx.createGain(); rg.gain.value=.3; rev.connect(rg); rg.connect(master);
    music=ctx.createGain(); music.gain.value=.5; music.connect(master); music.connect(rev);
    sfx=ctx.createGain(); sfx.gain.value=.75; sfx.connect(master); sfx.connect(rev);
    const dg=ctx.createGain(); dg.gain.value=0; const df=ctx.createBiquadFilter(); df.type='lowpass'; df.frequency.value=220; df.Q.value=5;
    [[55,'sawtooth',.3,-6],[82.4,'triangle',.2,0],[110.4,'sawtooth',.12,7]].forEach(([fr,type,g,det])=>{ const o=ctx.createOscillator(); o.type=type; o.frequency.value=fr; o.detune.value=det; const og=ctx.createGain(); og.gain.value=g; o.connect(og); og.connect(df); o.start(); });
    const lfo=ctx.createOscillator(); lfo.frequency.value=.06; const lg=ctx.createGain(); lg.gain.value=110; lfo.connect(lg); lg.connect(df.frequency); lfo.start();
    df.connect(dg); dg.connect(music); L.drone={g:dg,f:df};
    const cg=ctx.createGain(); cg.gain.value=0;
    [220,261.6,329.6].forEach((fr,i)=>{ const o=ctx.createOscillator(); o.frequency.value=fr; o.detune.value=i%2?4:-4; const og=ctx.createGain(); og.gain.value=.08; o.connect(og); og.connect(cg); o.start(); });
    cg.connect(music); L.choir={g:cg};
    (function crackle(){ if(ctx&&on&&started) burst(2400+Math.random()*2400,2,.03+Math.random()*.05,.03+Math.random()*.06); setTimeout(crackle,120+Math.random()*500); })();
    (function heart(){ if(ctx&&on&&heartOn){ boom(70,40,.28,.4); boom(64,38,.24,.28,.24); } setTimeout(heart,heartRate*1000); })();
    document.addEventListener('visibilitychange',()=>{ if(!ctx) return; if(document.hidden) ctx.suspend(); else if(started) ctx.resume(); });
  }
  function bell(fr,dur,gain,parts=[1,2.76,5.4],delay=0){ if(!ctx) return; const t=now()+delay; parts.forEach((p,i)=>{ const o=ctx.createOscillator(); o.frequency.value=fr*p; const g=ctx.createGain(); g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(gain/(i+1),t+.012); g.gain.exponentialRampToValueAtTime(.0001,t+dur/(i*.6+1)); o.connect(g); g.connect(sfx); o.start(t); o.stop(t+dur+.1); }); }
  function boom(from=95,to=38,dur=.9,gain=.6,delay=0){ if(!ctx) return; const t=now()+delay; const o=ctx.createOscillator(); o.frequency.setValueAtTime(from,t); o.frequency.exponentialRampToValueAtTime(to,t+dur); const g=ctx.createGain(); g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(gain,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+dur); o.connect(g); g.connect(sfx); o.start(t); o.stop(t+dur+.05); }
  function burst(fr,q,dur,gain,type='bandpass',delay=0){ if(!ctx) return; const t=now()+delay; const s=ctx.createBufferSource(); s.buffer=NB; const f=ctx.createBiquadFilter(); f.type=type; f.frequency.value=fr; f.Q.value=q; const g=ctx.createGain(); g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(gain,t+.01); g.gain.exponentialRampToValueAtTime(.0001,t+dur); s.connect(f); f.connect(g); g.connect(sfx); s.start(t,Math.random()*2); s.stop(t+dur+.05); }
  function sweep(){ if(!ctx) return; const t=now(); const s=ctx.createBufferSource(); s.buffer=NB; const f=ctx.createBiquadFilter(); f.type='bandpass'; f.Q.value=1.2; f.frequency.setValueAtTime(300,t); f.frequency.exponentialRampToValueAtTime(1200,t+.5); const g=ctx.createGain(); g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.08,t+.25); g.gain.exponentialRampToValueAtTime(.0001,t+.6); s.connect(f); f.connect(g); g.connect(sfx); s.start(t,Math.random()); s.stop(t+.65); }
  return {
    start(){ if(!ctx){ try{ init(); }catch(e){ return; } } started=true; ctx.resume(); ramp(L.drone.g.gain,.3,4); },
    mood(level,knots,ban){ if(!ctx) return; heartOn=ban>0; heartRate=knots>=4?.8:1.2; ramp(L.drone.f.frequency,200+level*70+knots*25,2.5); },
    deal(){ sweep(); },
    flip(kind){ if(kind==='punish'){ boom(110,40,1,.55); bell(196,2.4,.1,[1,1.41]); } else if(kind==='him') bell(392,2,.08); else if(kind==='secret'){ boom(80,30,1.4,.6); [196,233.1,293.7].forEach((f,i)=>bell(f,3,.07,[1,1.41],i*.2)); } else if(kind==='reward'){ [523.3,659.3,784].forEach((f,i)=>bell(f,2.2,.06,[1,2],i*.12)); } else if(kind==='final'){ [220,277.2,329.6].forEach((f,i)=>bell(f,3.5,.08,[1,2],i*.15)); } else bell(523,2,.08); },
    done(){ bell(659,1.6,.06,[1,2]); },
    skip(){ burst(1800,4,.08,.05); },
    knot(){ boom(95,36,.8,.6); burst(700,6,.25,.08,'bandpass',.05); },
    pause(){ if(!ctx) return; ramp(L.choir.g.gain,.35,2); bell(220,4,.08,[1,1.5,2]); },
    resume(){ if(!ctx) return; ramp(L.choir.g.gain,0,1.5); },
    end(){ [220,277.2,329.6,440].forEach((f,i)=>bell(f,4,.08,[1,2],i*.18)); },
    get on(){ return on; },
    toggle(){ on=!on; store.set('uzel-game-sound',on); if(ctx) ramp(master.gain,on?.9:0,.4); return on; }
  };
})();
function paintSound(){
  const html = Sound.on
    ? '<svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>'
    : '<svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16 9l6 6M22 9l-6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>';
  ['#sndHome','#sndGame'].forEach(s=>{ const b=$(s); if(b){ b.innerHTML=html; b.setAttribute('aria-label',Sound.on?'Выключить звук':'Включить звук'); } });
}


/* ---------- Кнопки ---------- */
function paintLen(){
  document.querySelectorAll('#lenSeg button').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.len===settings.len)));
}
$('#newBtn').onclick = startGame;
$('#lenSeg').onclick = e=>{
  const b = e.target.closest('button'); if(!b) return;
  settings.len = +b.dataset.len;
  store.set('uzel-settings2',settings);
  paintLen();
};
$('#scoreMinus').onclick = ()=>setScore(score-1);
$('#scorePlus').onclick = ()=>setScore(score+1);
$('#boundHome').onclick = ()=>setBound(!settings.bound);
$('#handsChip').onclick = ()=>{
  setBound(!settings.bound);
  if($('#card').classList.contains('flipped')){
    const c = game.q[game.i];
    $('#handsBox').hidden = !(settings.bound&&c.k==='her'&&c.h);
  } else render();
};
$('#resumeBtn').onclick = ()=>{
  game = store.get('uzel-game3');
  if(!game){ refreshHome(); return; }
  Sound.start(); unlockAudio(); keepAwake();
  show('game'); render();
};
$('#cardBack').onclick = reveal;
$('#doneBtn').onclick = ()=>advance(false);
$('#skipBtn').onclick = ()=>advance(true);
$('#failBtn').onclick = punish;
$('#finishBtn').onclick = finish;
$('#timer').onclick = toggleTimer;
/* Пауза с ценой: задание либо до паузы, либо следующей картой после неё */
let pending = null;
function paintPause(step){
  const before = pending&&pending.when==='before'&&step==='ask';
  const after = pending&&pending.when==='after';
  const during = pending&&pending.when==='during';
  $('#pauseTitle').textContent = step==='ask' ? 'Цена паузы' : 'Отдых';
  $('#pauseSub').textContent = before ? 'Сначала сделай это, потом пауза.'
    : after ? 'Пауза сейчас, а заплатишь сразу после текущей карты.'
    : during ? 'Ты отдыхаешь, но не просто так.'
    : 'Таймер остановлен.';
  $('#priceBox').hidden = !(before||after||during);
  $('#priceWhen').textContent = before ? 'Перед паузой' : during ? 'Пока отдыхаешь' : 'После паузы';
  $('#priceText').textContent = pending ? pending.t : '';
  $('#contBtn').textContent = before ? 'Сделала, теперь пауза' : 'Продолжить игру';
  $('#cancelPauseBtn').hidden = step!=='ask';
}
$('#pauseBtn').onclick = ()=>{
  pauseTimer(); Sound.pause();
  /* Цены паузы не повторяются, пока не кончатся все */
  const pu = game ? (game.pu||(game.pu=[])) : [];
  let pidx = PRICES.map((_,i)=>i).filter(i=>!pu.includes(i));
  if(!pidx.length){ pu.length = 0; pidx = PRICES.map((_,i)=>i); }
  const pi = pidx[Math.floor(Math.random()*pidx.length)];
  pu.push(pi);
  pending = PRICES[pi];
  paintPause('ask');
  $('#pauseOv').classList.add('active');
};
$('#contBtn').onclick = ()=>{
  if(pending&&pending.when==='before'){
    pending = null;
    paintPause('rest');
    return;
  }
  if(pending&&pending.when==='after'){
    game.q.splice(game.i+1,0,{k:'price',n:pending.n,t:pending.t,alt:pending.alt,s:pending.s,h:pending.h});
    saveGame();
  }
  pending = null;
  closeOverlays();
};
$('#cancelPauseBtn').onclick = ()=>{ pending = null; closeOverlays(); };
$('#endBtn').onclick = finish;
function refreshHome(){ $('#resumeBtn').hidden = !store.get('uzel-game3'); paintFound(); }

drawKnots(); drawSigil(); paintScore(); paintLen(); setBound(settings.bound); refreshHome(); paintSound();
$('#sndHome').onclick = $('#sndGame').onclick = ()=>{ Sound.toggle(); if(Sound.on&&game) Sound.start(); paintSound(); };
$('#sumBtn').onclick = closeOverlays;
</script>
