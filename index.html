<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#120a10">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Узел · Игра</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c070a; --bg-2:#170b12; --surface:rgba(255,255,255,.035); --surface-2:rgba(255,255,255,.07);
  --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.15);
  --ink:#f6ece8; --muted:#a8949c; --faint:#6c5a62;
  --her:#f0917b; --her-deep:#3e1620; --him:#93acf0; --him-deep:#16203f;
  --punish:#ff5d6e; --punish-deep:#470d19; --final:#e9c37c; --final-deep:#3a2a11;
  --serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --sans:"Manrope",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --r-lg:28px; --r-md:18px; --r-sm:12px;
  --shadow:0 30px 60px -20px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.06) inset;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
body{overflow:hidden;background:
  radial-gradient(90% 55% at 50% -12%,#3a1323 0%,transparent 70%),
  radial-gradient(70% 40% at 100% 110%,#1d1030 0%,transparent 70%),var(--bg)}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
button:focus-visible{outline:2px solid var(--final);outline-offset:3px}
.label{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

.screen{display:none;position:fixed;inset:0;width:100%;max-width:480px;margin:auto;
  padding:max(14px,env(safe-area-inset-top)) 16px max(14px,env(safe-area-inset-bottom));flex-direction:column}
.screen.active{display:flex}

.btn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;min-height:56px;padding:0 18px;border-radius:var(--r-md);font-weight:700;font-size:16px;letter-spacing:.01em;transition:transform .12s,background .2s}
.btn:active{transform:scale(.97)}
.btn svg{width:18px;height:18px;flex:none}
.btn-main{background:linear-gradient(180deg,#fff7f3,#ecdcd6);color:#1a0d14;box-shadow:0 10px 24px -12px rgba(255,220,210,.5)}
.btn-line{border:1px solid var(--line-2);background:var(--surface)}
.btn-punish{background:linear-gradient(180deg,#5a1222,#3e0b17);color:#ffd5da;border:1px solid rgba(255,93,110,.55)}
.btn-text{min-height:40px;color:var(--muted);font-weight:500;font-size:14px}

/* ---------- Главная ---------- */
#home{gap:10px}
.home-mid{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.hero-knot{width:132px;height:132px;color:var(--her);filter:drop-shadow(0 0 22px rgba(240,145,123,.35));margin-bottom:6px}
.hero-knot path{fill:none;stroke:currentColor;stroke-width:.2;stroke-linecap:round;transition:stroke-dashoffset 2.6s cubic-bezier(.4,0,.2,1)}
.hero-knot path.draw{stroke-dashoffset:0!important}
h1{font:500 78px/.95 var(--serif);margin:0;letter-spacing:.01em}
.tagline{margin-top:12px}
h2{font:500 36px/1.1 var(--serif);margin:0}
.panel{border-radius:var(--r-md);background:var(--surface);border:1px solid var(--line);padding:14px 16px}
.panel-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.panel-sub{font-size:13px;color:var(--muted);margin-top:3px}
.knot-ctl{display:flex;align-items:center;gap:10px}
.knot-ctl button{width:40px;height:40px;border-radius:12px;background:var(--surface-2);font-size:20px;line-height:1;color:var(--ink)}
.pips{display:flex;gap:7px;align-items:center}
.pips i{display:block;width:11px;height:11px;border-radius:50%;border:1.5px solid rgba(255,93,110,.55)}
.pips i.on{background:var(--punish);border-color:var(--punish);box-shadow:0 0 10px rgba(255,93,110,.7)}
.pips.lg i{width:14px;height:14px}
.switch{flex:none;width:52px;height:30px;border-radius:15px;background:var(--surface-2);border:1px solid var(--line-2);position:relative;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--ink);transition:transform .2s}
.switch[aria-checked=true]{background:var(--her);border-color:var(--her)}
.switch[aria-checked=true]::after{transform:translateX(22px)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;border-radius:var(--r-md);background:var(--surface);border:1px solid var(--line)}
.seg button{min-height:52px;border-radius:14px;font-weight:700;font-size:15px;line-height:1.2;color:var(--muted);transition:background .2s,color .2s}
.seg small{display:block;font-weight:500;font-size:11px;opacity:.8;margin-top:2px}
.seg button[aria-pressed=true]{background:var(--surface-2);color:var(--ink);box-shadow:0 0 0 1px var(--line-2) inset}

/* ---------- Игра ---------- */
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.progress{flex:1;min-width:0}
.progress-label{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.progress-label #countLabel{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.seg-bar{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.seg-bar span{height:3px;border-radius:2px;background:var(--line-2);overflow:hidden}
.seg-bar i{display:block;height:100%;background:var(--her);transform-origin:left;transform:scaleX(0);transition:transform .45s}
.pause{flex:none;display:flex;align-items:center;gap:7px;height:40px;padding:0 14px;border-radius:20px;background:var(--surface-2);border:1px solid var(--line);font-weight:700;font-size:13px}
.pause svg{width:12px;height:12px}
.chips{display:flex;gap:6px;margin-bottom:12px}
.chip{display:flex;align-items:center;gap:8px;height:34px;padding:0 12px;border-radius:17px;background:var(--surface);border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.chip-hands{flex:1;justify-content:center;min-width:0}
.chip-hands[aria-pressed=true]{color:var(--ink);border-color:rgba(240,145,123,.5);background:rgba(240,145,123,.12)}
.chip-ban{color:#ffd5da;border-color:rgba(255,93,110,.5);background:rgba(255,93,110,.12)}

.stage{flex:1;min-height:0;perspective:1600px;position:relative}
.stage.deal{animation:deal .45s cubic-bezier(.2,.9,.3,1)}
@keyframes deal{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
.card{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.3,.9,.25,1)}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:var(--r-lg);display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--shadow)}
.back{width:100%;color:inherit;align-items:center;justify-content:center;text-align:center;
  background:
    radial-gradient(80% 60% at 50% 40%,color-mix(in srgb,var(--tone) 18%,transparent),transparent 70%),
    repeating-linear-gradient(135deg,rgba(255,255,255,.025) 0 1px,transparent 1px 12px),
    linear-gradient(165deg,var(--deep),#120910)}
.back::before{content:"";position:absolute;inset:12px;border:1px solid color-mix(in srgb,var(--tone) 40%,transparent);border-radius:20px}
.back::after{content:"";position:absolute;inset:17px;border:1px solid color-mix(in srgb,var(--tone) 15%,transparent);border-radius:16px}
.back-emblem{width:74px;height:74px;color:var(--tone);opacity:.9;margin-bottom:18px;filter:drop-shadow(0 0 18px color-mix(in srgb,var(--tone) 50%,transparent))}
.back-who{font:500 50px/1 var(--serif);color:var(--ink)}
.back-level{margin-top:12px;color:var(--tone)}
.back-hint{position:absolute;bottom:34px;left:0;right:0;display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;color:var(--muted)}
.tap-dot{width:8px;height:8px;border-radius:50%;background:var(--tone);animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--tone) 60%,transparent)}100%{box-shadow:0 0 0 12px transparent}}
.front{transform:rotateY(180deg);padding:20px 20px 16px;background:
  radial-gradient(120% 50% at 0% 0%,color-mix(in srgb,var(--tone) 14%,transparent),transparent 60%),
  linear-gradient(175deg,var(--deep) 0%,#140a10 55%)}
.front::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,var(--tone),transparent)}
.front-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:4px}
.front-head .label{color:var(--tone)}
.pill{font-size:11px;font-weight:700;padding:5px 10px;border-radius:12px;background:rgba(255,255,255,.07);color:var(--muted);white-space:nowrap}
.read{font-size:12px;color:var(--faint);margin-bottom:2px}
.front-body{flex:1;min-height:0;overflow-y:auto;padding-top:10px;scrollbar-width:none}
.front-body::-webkit-scrollbar{display:none}
.title{font:500 40px/1.02 var(--serif);margin:0 0 12px;letter-spacing:-.005em}
.text{font-size:18px;line-height:1.5;margin:0;color:#efe2de}
.box{position:relative;margin:12px 0 0;padding:11px 14px 11px 16px;border-radius:var(--r-sm);background:rgba(0,0,0,.25);border:1px solid var(--line);font-size:14.5px;line-height:1.45;color:#e6d7d3}
.box::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:2px;border-radius:2px;background:var(--tone)}
.box b{display:block;font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--tone);margin-bottom:4px}
.box-ups::before{background:var(--punish)}
.box-ups b{color:var(--punish)}
.ups{list-style:none;margin:0;padding:0;display:grid;gap:5px}
.ups li{padding-left:14px;position:relative}
.ups li::before{content:"";position:absolute;left:0;top:.6em;width:6px;height:6px;border-radius:50%;background:var(--punish)}
.timer{flex:none;margin-top:14px;display:flex;align-items:center;gap:14px;width:100%;min-height:62px;padding:8px 14px;border-radius:var(--r-md);background:rgba(255,255,255,.05);border:1px solid var(--line);text-align:left}
.ring{width:44px;height:44px;flex:none;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:3.5}
.ring-bg{stroke:rgba(255,255,255,.1)}
.ring-fg{stroke:var(--tone);stroke-linecap:round;stroke-dasharray:125.66;stroke-dashoffset:0;transition:stroke-dashoffset .25s linear}
.timer-txt{display:flex;flex-direction:column;flex:1}
.timer b{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.timer span{font-size:12.5px;color:var(--muted)}
.timer.done{background:color-mix(in srgb,var(--tone) 22%,transparent);border-color:var(--tone)}
.her{--tone:var(--her);--deep:var(--her-deep)}
.him{--tone:var(--him);--deep:var(--him-deep)}
.punish{--tone:var(--punish);--deep:var(--punish-deep)}
.final,.price{--tone:var(--final);--deep:var(--final-deep)}
.secret{--tone:#c59bff;--deep:#22103a}
.reward{--tone:#8fe0b8;--deep:#0d2e22}
.obey{display:flex;align-items:center;gap:3px;margin-left:auto;margin-right:10px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.obey em{font-style:normal;margin-right:3px}
.obey i{width:5px;height:5px;border-radius:50%;background:var(--line-2)}
.obey i.on{background:#8fe0b8;box-shadow:0 0 6px rgba(143,224,184,.7)}
.found{text-align:center;font-size:12.5px;color:var(--muted);margin-bottom:10px}

.actions{flex:none;padding-top:12px;display:grid;gap:4px;opacity:0;pointer-events:none;transform:translateY(6px);transition:opacity .25s .25s,transform .25s .25s}
.actions.on{opacity:1;pointer-events:auto;transform:none}
.two{display:grid;grid-template-columns:1.15fr 1fr;gap:8px}

.toast{position:fixed;left:50%;top:max(12px,env(safe-area-inset-top));transform:translate(-50%,-12px);z-index:5;display:flex;align-items:center;gap:10px;padding:12px 18px;border-radius:16px;background:#2a0b14;border:1px solid var(--punish);color:#ffd5da;font-weight:700;font-size:15px;white-space:nowrap;box-shadow:0 14px 30px -10px rgba(255,93,110,.45);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s}
.toast.on{opacity:1;transform:translate(-50%,0)}

.chip-snd{flex:none;width:34px;padding:0;justify-content:center}
.chip-snd svg,.snd-btn svg{width:16px;height:16px}
.snd-btn{margin-top:16px;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line-2);background:var(--surface);color:var(--muted)}
.sum{text-align:center}
.sum-sigil{width:64px;height:64px;color:var(--punish);filter:drop-shadow(0 0 14px rgba(255,93,110,.6));margin-bottom:6px}
.sum-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}
.sum-grid div{padding:10px 6px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid var(--line)}
.sum-grid b{display:block;font:600 26px/1.1 var(--serif);color:var(--ink)}
.sum-grid span{font-size:11px;color:var(--muted)}
.answer{text-align:center;font:italic 600 46px/1 var(--serif);color:var(--final);margin:6px 0 12px}

/* ---------- Пауза ---------- */
.overlay{display:none;position:fixed;inset:0;z-index:10;background:rgba(6,3,5,.95);padding:max(20px,env(safe-area-inset-top)) 16px max(20px,env(safe-area-inset-bottom));overflow-y:auto}
.overlay.active{display:block}
.overlay-in{max-width:448px;min-height:100%;margin:auto;display:flex;flex-direction:column;justify-content:center;gap:10px}
.sheet{border-radius:var(--r-lg);padding:24px 20px 20px;background:linear-gradient(170deg,#24141c,#140a10);border:1px solid var(--line);box-shadow:var(--shadow);margin-bottom:6px}
.sheet .label{color:var(--final)}
.sheet h2{margin:6px 0 8px}
.sheet p{color:var(--muted);line-height:1.5;margin:0}
.sheet .box{margin-top:16px}

@media (max-height:700px){
  .hero-knot{width:96px;height:96px}h1{font-size:58px}
  .title{font-size:32px}.text{font-size:16.5px}.front{padding:16px 16px 12px}
  .back-emblem{width:56px;height:56px}.back-who{font-size:40px}
}
@media (prefers-reduced-motion:reduce){
  .card,.actions,.toast,.stage.deal,.hero-knot path,.tap-dot{transition:none;animation:none}
}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs><symbol id="trefoil" viewBox="-3.5 -3.5 7 7"><path id="trefoilPath" fill="none" stroke="currentColor" stroke-width=".22" stroke-linecap="round"/></symbol><symbol id="sigil" viewBox="-5.2 -5.2 10.4 10.4"><path id="sigilPath" fill="none" stroke="currentColor" stroke-width=".24" stroke-linecap="round" stroke-linejoin="round"/></symbol></defs>
</svg>

<section id="home" class="screen active">
  <div class="home-mid">
    <svg class="hero-knot" viewBox="-3.6 -3.6 7.2 7.2" aria-hidden="true"><path id="heroPath"/></svg>
    <h1>Узел</h1>
    <div class="label tagline">Игра на двоих</div>
    <button class="snd-btn" id="sndHome"></button>
  </div>
  <div class="panel">
    <div class="panel-row">
      <div><div class="label">Узлы</div><div class="panel-sub" id="tierLabel"></div></div>
      <div class="knot-ctl">
        <button id="scoreMinus" aria-label="Убрать узел">−</button>
        <div class="pips lg" id="pipsHome"></div>
        <button id="scorePlus" aria-label="Добавить узел">+</button>
      </div>
    </div>
  </div>
  <div class="panel panel-row">
    <div class="label">Руки уже связаны</div>
    <button class="switch" id="boundHome" role="switch" aria-checked="false" aria-label="Руки уже связаны"></button>
  </div>
  <div class="seg" id="lenSeg">
    <button data-len="16">16 карт<small>~50 минут</small></button>
    <button data-len="28">28 карт<small>~1,5 часа</small></button>
    <button data-len="40">40 карт<small>весь вечер</small></button>
  </div>
  <div class="found" id="foundLabel"></div>
  <button class="btn btn-line" id="resumeBtn" hidden>Продолжить игру</button>
  <button class="btn btn-main" id="newBtn">Новая игра</button>
</section>

<section id="game" class="screen">
  <div class="topbar">
    <div class="progress">
      <div class="progress-label"><span class="label" id="lvlLabel"></span><span class="obey" id="obeyDots" title="Шесть карт подряд без наказания и пропуска — и её ждёт поощрение"><em>милость</em><i></i><i></i><i></i><i></i><i></i><i></i></span><span id="countLabel"></span></div>
      <div class="seg-bar"><span><i></i></span><span><i></i></span><span><i></i></span></div>
    </div>
    <button class="pause" id="pauseBtn"><svg viewBox="0 0 12 12" aria-hidden="true"><rect x="2" y="1" width="3" height="10" rx="1" fill="currentColor"/><rect x="7" y="1" width="3" height="10" rx="1" fill="currentColor"/></svg>Пауза</button>
  </div>
  <div class="chips">
    <div class="chip" aria-label="Узлы"><span>Узлы</span><div class="pips" id="pipsGame"></div></div>
    <button class="chip chip-hands" id="handsChip" aria-pressed="false"></button>
    <div class="chip chip-ban" id="banChip" hidden></div>
    <button class="chip chip-snd" id="sndGame" aria-label="Звук"></button>
  </div>
  <div class="stage">
    <div class="card" id="card">
      <button class="face back" id="cardBack" aria-label="Открыть карту">
        <svg class="back-emblem" aria-hidden="true"><use href="#sigil"/></svg>
        <div class="back-who" id="backWho"></div>
        <div class="back-level label" id="backLevel"></div>
        <div class="back-hint"><span class="tap-dot"></span><span id="backHint"></span></div>
      </button>
      <div class="face front">
        <div class="front-head"><span class="label" id="kind"></span><span class="pill" id="levelPill"></span></div>
        <div class="read" id="readAloud">Прочитай ей вслух</div>
        <div class="front-body">
          <h2 class="title" id="title"></h2>
          <p class="text" id="text"></p>
          <div class="box" id="altBox" hidden><b>Или вместо этого</b><span id="alt"></span></div>
          <div class="box" id="legsBox" hidden><b>Ноги</b><span id="legsText"></span></div>
          <div class="box box-ups" id="upsBox" hidden><b>Из-за узлов</b><ul class="ups" id="ups"></ul></div>
          <div class="box" id="handsBox" hidden><b>Руки</b>Сейчас развяжи ей руки или свяжи их спереди.</div>
          <div class="box box-ups" id="banBox" hidden><b>Запрет</b><span id="banText"></span></div>
        </div>
        <button class="timer" id="timer" hidden>
          <svg class="ring" viewBox="0 0 48 48" aria-hidden="true"><circle class="ring-bg" cx="24" cy="24" r="20"/><circle class="ring-fg" id="ringFg" cx="24" cy="24" r="20"/></svg>
          <span class="timer-txt"><b id="timerTime"></b><span id="timerState"></span></span>
        </button>
      </div>
    </div>
  </div>
  <div class="actions" id="actions">
    <div class="two" id="mainRow">
      <button class="btn btn-main" id="doneBtn"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 10.5l4 4 8-9" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>Готово</button>
      <button class="btn btn-punish" id="failBtn"><svg aria-hidden="true"><use href="#sigil" style="stroke-width:.4"/></svg>Наказание</button>
    </div>
    <button class="btn btn-main" id="finishBtn" hidden>Завершить</button>
    <button class="btn btn-text" id="skipBtn">Пропустить</button>
  </div>
</section>

<div class="toast" id="toast" role="status"></div>

<div class="overlay" id="pauseOv" role="dialog" aria-modal="true" aria-labelledby="pauseTitle">
  <div class="overlay-in">
    <div class="sheet">
      <div class="label" id="pauseEyebrow">Пауза</div>
      <h2 id="pauseTitle"></h2>
      <p id="pauseSub"></p>
      <div class="box price" id="priceBox" hidden><b id="priceWhen"></b><span id="priceText"></span></div>
    </div>
    <button class="btn btn-main" id="contBtn"></button>
    <button class="btn btn-line" id="endBtn">Закончить игру</button>
    <button class="btn btn-text" id="cancelPauseBtn" hidden>Передумала, без паузы</button>
  </div>
</div>

<div class="overlay" id="sumOv" role="dialog" aria-modal="true" aria-labelledby="sumTitle">
  <div class="overlay-in">
    <div class="sheet sum">
      <svg class="sum-sigil" aria-hidden="true"><use href="#sigil"/></svg>
      <div class="label">Итог ночи</div>

{k:'her',l:2,n:'Проси грязно',t:'Ласкай себя и проси хозяина дать тебе дилдо. Самыми грязными словами, какие знаешь. Замолчала — наказание.',s:120,h:1,up:[[1,'Ещё и вставить его самому.'],[2,'В тебе железная пробка.'],[3,'Он тянет ещё минуту.'],[4,'Кончать нельзя.']]},
{k:'her',l:2,n:'Не выпускай',oral:1,t:'Сделай ему минет: держи во рту и не выпускай, что бы ни происходило.',alt:'Держи во рту два его пальца или фиолетовый дилдо. Выпустила — наказание.',s:150,up:UO},
{k:'her',l:2,n:'Свои пальцы',t:'Соси свои пальцы так, будто делаешь минет: чередуй медленно и глубоко. Другой рукой ласкай себя.',s:150,h:1,up:UM},
{k:'her',l:2,n:'В его руках',oral:1,t:'Сделай ему минет. Ты не двигаешься, темп полностью задаёт он.',alt:'Он сам двигает пальцами у тебя во рту и меняет темп, когда захочет.',s:150,up:UO},
{k:'her',l:2,n:'Раскрытая на стуле',t:'Сядь на стул, разведи ноги как можно шире и поставь ступни на сиденье. Сиди раскрытая перед хозяином и не своди колени. Свела — наказание.',s:150,up:[[1,'Он гладит тебя, когда захочет.'],[2,'К тебе прижат пингвин.'],[3,'В тебе железная пробка.'],[4,'Кончать нельзя, а пингвин включён всё время.']]},
{k:'her',l:2,n:'Прыгай',t:'Хозяин держит фиолетовый дилдо на стуле. Садись на него и двигайся вверх-вниз. Остановилась — наказание.',s:150,up:UD},
{k:'her',l:2,n:'На лицо',t:'Сядь хозяину на лицо и двигайся. Не стесняйся и не отстраняйся.',s:240,face:1,up:[[1,'Твоя рука на его члене, отпускать нельзя.'],[2,'В тебе железная пробка.'],[3,'Кончать только по его команде.'],[4,'Кончить нельзя, а двигаться придётся до конца таймера.']]},
{k:'her',l:2,n:'Ножками',t:'Дрочи ему ступнями не переставая. Остановилась — наказание.',s:180,up:UW},
{k:'her',l:2,n:'Целуй и дрочи',t:'Сама поцелуй его и засунь язык ему в рот. Не убирай его и одновременно дрочи ему. Остановила что-то одно — наказание.',s:90,h:1,up:UW},
{k:'her',l:2,n:'Целуй жёстко',t:'Сама лезь к нему целоваться: жёстко, глубоко, кусай за губы. Отстранилась первой — наказание.',s:90,up:[[1,'Твоя рука на его члене, отпускать нельзя.'],[2,'В тебе железная пробка.'],[3,'На тебе белый вибратор.'],[4,'Кончать нельзя, пока он не отпустит.']]},
{k:'her',l:2,n:'Держись и терпи',t:'Держись за его член обеими руками, пока он ласкает тебя пингвином. Отпустила или кончила — наказание.',s:240,h:1,up:[[1,'В тебе фиолетовый дилдо.'],[2,'В тебе железная пробка.'],[3,'Чёрный дилдо вместо фиолетового.'],[4,'Пробка чёрная, с вибрацией.']]},

/* ---------- ДЛЯ НЕЁ: этап 3 ---------- */
{k:'her',l:3,n:'Верхом сзади',anal:1,as:1,t:'Смажь его член и сама садись на него попкой — медленно, пока не войдёт целиком. Двигайся верхом, лицом к нему. Темп твой, но останавливаться нельзя.',s:300,up:[[1,'Он крутит тебе соски.'],[2,'Он держит пингвина у твоего клитора.'],[3,'В киске фиолетовый дилдо.'],[4,'Кончить можно только вместе с ним.']]},
{k:'her',l:3,n:'Насадись',anal:1,as:1,t:'Встань над ним спиной к нему, раздвинь ягодицы руками и опускайся попкой на его член. Ему видно всё. Поднимайся и опускайся до конца таймера.',s:240,up:[[1,'Потом руки за голову.'],[2,'Он шлёпает тебя каждый раз, когда ты опускаешься.'],[3,'Белый вибратор закреплён на клиторе.'],[4,'Кончать нельзя.']]},
{k:'her',l:3,n:'Не дыши',t:'Ласкай себя пингвином. Каждый раз на самом краю он говорит «не дыши» — ты задерживаешь дыхание, пока он считает до десяти. Кончить можно только на выдохе, после его «можно».',s:300,h:1,up:UM},
{k:'her',l:3,n:'Двое шариков',t:'Одни шарики в киску, другие сзади. Вводишь сама, по одному, чередуя: шарик туда, шарик сюда. Все восемь. Потом ласкаешь себя, не давая им выскользнуть.',s:180,h:1,up:[[1,'Он считает вслух каждый шарик.'],[2,'На тебе пингвин.'],[3,'Кончать нельзя.'],[4,'Выскользнул шарик — начинаешь заново.']]},
{k:'her',l:3,n:'Кончи на его бедре',t:'Оседлай его бедро и кончи, трясь о него, без рук. Он держит тебя за бёдра и смотрит. Не успела за время таймера — наказание.',s:300,up:[[1,'Можно только после его слова «давай».'],[2,'В тебе железная пробка.'],[3,'На сосках зажимы.'],[4,'Кончила — продолжаешь, пока не выйдет время.']]},
{k:'her',l:3,n:'Выдержи восемь минут',t:'Ласкай его руками или вибратором все восемь минут, не останавливаясь ни на секунду. Остановилась — время начинается заново.',s:480,h:1,up:[[1,'В тебе фиолетовый дилдо.'],[2,'В тебе железная пробка.'],[3,'Кончать нельзя.'],[4,'Чёрный дилдо вместо фиолетового.']]},
{k:'her',l:3,n:'Наклонись',t:'Встань, широко разведи ноги, наклонись и растяни ягодицы руками на максимум. Держи, пока идёт таймер. Отпустила — наказание.',s:90,h:1,up:[[1,'Он шлёпает тебя, когда захочет.'],[2,'В киске чёрный дилдо.'],[3,'Он лижет тебя сзади.'],[4,'Кончать нельзя.']]},
{k:'her',l:3,n:'Подставка',t:'Встань на четвереньки, он кладёт стек тебе на поясницу. Держи ровно, пока он ласкает тебя пальцами. Уронила — пять ударов этим стеком.',s:150,h:1,up:[[1,'В тебе железная пробка.'],[2,'Вместо пальцев перкуссионный вибратор.'],[3,'Кончать нельзя.'],[4,'Уронила — десять ударов и заново.']]},
{k:'her',l:3,n:'На цыпочках',t:'Встань на цыпочки, ноги широко. Он ласкает тебя пальцами. Опустила пятки — наказание.',s:150,up:[[1,'В тебе железная пробка.'],[2,'Вместо пальцев пингвин.'],[3,'Кончать нельзя.'],[4,'Пробка чёрная, с вибрацией.']]},
{k:'her',l:3,n:'На грани',t:'Доведи себя почти до оргазма и остановись в последний момент. Три раза подряд. Кончила — наказание.',s:300,h:1,up:[[1,'Четыре раза.'],[2,'С пингвином.'],[3,'С пробкой и дилдо.'],[4,'Пять раз, и каждый раз он решает, продолжать ли.']]},
{k:'her',l:3,n:'Проси',t:'Ласкай себя пингвином. Когда будешь близко, проси хозяина разрешить кончить. Решает только он.',s:300,h:1,up:[[1,'Первые две просьбы он отказывает.'],[2,'В тебе фиолетовый дилдо.'],[3,'Чёрный дилдо вместо фиолетового.'],[4,'Просить нужно громко и грязными словами.']]},
{k:'her',l:3,n:'На голос',t:'Встань на колени и иди к его голосу. Он отходит и зовёт. Дошла — целуешь его руку и говоришь «я здесь, хозяин».',s:120,up:[[1,'В тебе железная пробка.'],[2,'На сосках зажимы.'],[3,'На тебе ремнями закреплён белый вибратор.'],[4,'Он шлёпает тебя стеком, пока ты идёшь.']]},
{k:'her',l:3,n:'Подставься',t:'Встань на колени и подставь зад. Двадцать шлепков. После каждого говори «спасибо, хозяин» и проси следующий.',up:[[1,'Тридцать.'],[2,'Десять из них стеком.'],[3,'Внутри тебя всё это время игрушка.'],[4,'Сбилась — начинаем сначала.']]},
{k:'her',l:3,n:'Кончи для него',t:'Кончи от своей руки и белого вибратора. Можно только после его слова «давай». Раньше времени — наказание.',s:300,h:1,up:[[1,'Он тянет с разрешением.'],[2,'В тебе железная пробка.'],[3,'Сразу после этого ещё один, без паузы.'],[4,'И третий.']]},
{k:'her',l:3,n:'Зажимы',t:'Сама надень зажимы на соски. Встань на колени, разведи ноги и держи спину ровно.',s:150,h:1,up:[[1,'Он тянет за зажимы, когда захочет.'],[2,'В тебе железная пробка.'],[3,'На тебе белый вибратор.'],[4,'В конце он снимает их по одному, а ты благодаришь.']]},
{k:'her',l:3,n:'На коленях',t:'Встань на колени и целуй ему ступни. После каждого поцелуя: «спасибо, хозяин».',alt:'Целуй ему ладони и пальцы, по одному, с тем же «спасибо, хозяин».',s:120,up:UW},
{k:'her',l:3,n:'До конца',oral:1,t:'Сделай хозяину минет глубоко и не останавливайся до конца таймера.',alt:'Соси его пальцы глубоко, не останавливаясь. Он решает, сколько пальцев и какой темп.',s:240,up:UO},
{k:'her',l:3,n:'Двойная работа',oral:1,t:'Сделай ему минет, пока на тебе закреплён белый вибратор. Остановилась — наказание.',alt:'Соси его пальцы, не выпуская, пока вибратор работает.',s:240,up:[[1,'Мощность выше.'],[2,'В тебе железная пробка.'],[3,'Кончать нельзя.'],[4,'Он говорит, когда можно кончить, а ты после этого продолжаешь.']]},
{k:'her',l:3,n:'Чёрный',t:'Садись на чёрный дилдо на стуле. Хозяин держит его. Каждый раз опускайся чуть глубже, насколько получается.',s:210,up:[[1,'В тебе железная пробка.'],[2,'К тебе прижат пингвин.'],[3,'Кончать нельзя.'],[4,'Пробка чёрная, с вибрацией.']]},
{k:'her',l:3,n:'Кончи на лице',t:'Сядь хозяину на лицо и двигайся сама, пока не кончишь.',s:300,face:1,up:[[1,'Кончить можно только после его команды «давай».'],[2,'В тебе железная пробка.'],[3,'На сосках зажимы.'],[4,'После оргазма не слезаешь, пока не выйдет время.']]},
{k:'her',l:3,n:'Ножками и язык',t:'Дрочи ему ступнями, пока на тебе работает вибратор, и держи язык высунутым. Остановилась или убрала язык — наказание.',s:210,up:[[1,'В тебе железная пробка.'],[2,'Мощность на максимум.'],[3,'Кончать нельзя.'],[4,'На сосках зажимы.']]},
{k:'her',l:3,n:'Дрочи и терпи',t:'Дрочи ему не переставая, а он доводит тебя пингвином до грани и убирает его. Остановилась — наказание.',s:300,h:1,up:[[1,'В тебе фиолетовый дилдо.'],[2,'В тебе железная пробка.'],[3,'Чёрный дилдо вместо фиолетового.'],[4,'Кончишь — проиграла.']]},
{k:'her',l:3,n:'Сними повязку',t:'Сними повязку, смотри хозяину прямо в глаза и ласкай себя. Отвела взгляд — наказание.',s:180,h:1,up:UM},

/* ---------- ДЛЯ НЕГО: этап 1 ---------- */
{k:'him',l:1,n:'Дорожка льда',t:'Веди кубиком льда по её шее, груди, животу, внутренней стороне бёдер. Где прошёл лёд — сразу тёплые губы.',s:150,up:UF},
{k:'him',l:1,n:'Ладонями',t:'Гладь её всю ладонями: шею, грудь, живот, бёдра, ступни. Медленно, с нажимом. Киску не трогай, как бы она ни выгибалась.',s:180,up:UF},
{k:'him',l:1,n:'Кончиками пальцев',t:'Води кончиками пальцев по её киске, едва касаясь. Медленные круги вокруг клитора, но не по нему. Она не просит и не двигается навстречу.',s:150,up:UF},
{k:'him',l:1,n:'Грудь в руках',t:'Мни её грудь обеими руками: сжимай, тяни, покручивай соски пальцами. Она держит руки за головой и не опускает.',s:150,up:UF},
{k:'him',l:1,n:'Ноги',t:'Лижи ей ступни и пальцы ног, не торопись. Она не двигается и не убирает ноги.',s:180,up:UH},
{k:'him',l:1,n:'Только язык',t:'Сделай ей куни очень медленно, только языком и без пальцев. Цель — раздразнить. Остановись в последний момент, когда она будет близко.',s:240,up:[[1,'В ней железная пробка.'],[2,'Её рука на твоём члене, отпускать нельзя.'],[3,'В ней фиолетовый дилдо, двигай им.'],[4,'Останавливайся дважды.']]},
{k:'him',l:1,n:'Десять',t:'Уложи её себе на колени и дай десять шлепков. Она считает вслух, сбилась — заново.',up:US},
{k:'him',l:1,n:'Соски',t:'Кусай и выкручивай ей соски: сначала мягко, потом сильнее, по её реакции.',s:150,up:[[1,'На ней белый вибратор.'],[2,'В ней фиолетовый дилдо.'],[3,'Потом зажимы до конца следующей карты.'],[4,'Зажимы сразу, а ты работаешь ртом по всему телу.']]},
{k:'him',l:1,n:'За головой',t:'Свяжи ей запястья и закрепи за головой. Руки там остаются, пока следующая карта не скажет иначе. Пока фиксируешь, целуй её.',bind:1,up:[[1,'Заодно разведи ей ноги и прикажи держать.'],[2,'Сразу вставь железную пробку.'],[3,'Сразу надень зажимы.'],[4,'И чёрная пробка, и зажимы.']]},
{k:'him',l:1,n:'Пальцы в рот',t:'Сам двигай двумя пальцами у неё во рту. Меняй темп. Выпустила — наказание.',s:120,up:UH},
{k:'him',l:1,n:'За волосы',t:'Возьми её за волосы у корней, отведи голову и шепни на ухо, что сделаешь с ней дальше. Потом сделай.',s:120,up:UH},
{k:'him',l:1,n:'За подбородок',t:'Крепко возьми её за подбородок, поверни лицо к себе и заставь повторить: «Я твоя, хозяин». Не отпускай, пока не скажет так, как тебе нравится.',s:60,up:UH},
{k:'him',l:1,n:'Укусы',t:'Кусай её плечи, бёдра и ягодицы: ощутимо, но без следов.',s:150,up:UH},
{k:'him',l:1,n:'Целуй всю',t:'Поцелуй её всю, не пропуская: лоб, плечи, грудь, живот, спину, руки, ягодицы, бёдра, ступни.',s:180,up:UH},
{k:'him',l:1,n:'Уши и шея',t:'Ласкай её уши и шею: целуй, лижи, дыши рядом. Она не двигается и не отстраняется.',s:150,up:UH},
{k:'him',l:1,n:'Пальцы в киске',t:'Вставь в неё два пальца и двигай медленно, большим ласкай клитор. Она держит ноги разведёнными.',s:180,up:UH},
{k:'him',l:1,n:'Снаружи',anal:1,t:'Смажь палец и ласкай её заднюю дырочку только снаружи, не входя: круги и лёгкие нажатия.',s:180,up:[[1,'Другая рука в киске.'],[2,'Она сама разводит ягодицы руками на максимум.'],[3,'На ней белый вибратор.'],[4,'Кончать нельзя.']]},
{k:'him',l:1,n:'Подразни',t:'Включи пингвина и держи рядом, не касаясь. Подноси на пару секунд и убирай. Пусть просит.',s:150,up:[[1,'Держи дольше.'],[2,'В ней железная пробка.'],[3,'На сосках зажимы.'],[4,'Она просит «пожалуйста, хозяин» после каждого раза.']]},

{k:'him',l:1,n:'Ногтями',t:'Веди ногтями по её спине, бёдрам, соскам и внутренней стороне бёдер: ощутимо, но без царапин.',s:150,up:UH},
{k:'him',l:1,n:'Шлепок и ласка',t:'Уложи её себе на колени. Шлепок, потом ласка пальцами между ног, снова шлепок. Чередуй и не давай угадать ритм.',s:180,up:US},
{k:'him',l:1,n:'Команды',t:'Отдавай короткие команды шёпотом: сядь, встань, повернись, раздвинь, на колени, прогнись. Замешкалась — шлепок.',s:120,up:[[1,'Команды быстрее.'],[2,'В ней железная пробка.'],[3,'Шлепок стеком.'],[4,'На сосках зажимы.']]},
{k:'him',l:1,n:'Ноги на плечах',t:'Положи её ноги себе на плечи и лижи. Держи за бёдра и не давай опустить ноги.',s:210,up:UH},

/* ---------- ДЛЯ НЕГО: этап 2 ---------- */
{k:'him',l:2,n:'Раскрыть попку',anal:1,t:'Поставь её на колени, грудь на кровать. Лижи ей попку, потом смажь и медленно растягивай пальцами — одним, двумя. На каждом новом пальце она говорит «спасибо, хозяин».',s:240,up:UF},
{k:'him',l:2,n:'Горячо-холодно',t:'Возьми в рот лёд и целуй её соски и киску холодным ртом. Выплюнь — и тем же ртом, но горячим. Чередуй: она не знает, что будет следующим.',s:240,up:UH},
{k:'him',l:2,n:'Холодный дилдо',t:'Подержи фиолетовый дилдо в ледяной воде и медленно введи в неё. Потом вынь и согрей её пальцами и языком. Снова холод — снова тепло.',s:240,up:UH},
{k:'him',l:2,n:'Рукой до грани',t:'Только рукой доведи её до самого края и остановись. Дай ей отдышаться — и снова. Три раза подряд, кончать нельзя.',s:300,up:UF},
{k:'him',l:2,n:'Разомни её',t:'Мни ей попку и бёдра обеими руками, сильно, как массаж. Время от времени — шлепок, и пальцы скользят между ног.',s:180,up:UF},
{k:'him',l:2,n:'Шарик за шариком',t:'Смажь анальные шарики и вводи ей сзади по одному, медленно, все четыре. Потом так же медленно вынимай. На каждом шарике она говорит «спасибо, хозяин».',s:180,up:UH},
{k:'him',l:2,n:'Шарики в киске',t:'Введи шарики ей в киску и лижи клитор. Время от времени тяни за кольцо — чуть-чуть, не вынимая. Она не должна отстраняться.',s:240,up:[[1,'Вторые шарики — сзади.'],[2,'Руки связаны за спиной.'],[3,'Кончать нельзя.'],[4,'На сосках зажимы.']]},
{k:'him',l:2,n:'Дилдо и язык',t:'Двигай в ней фиолетовым дилдо и одновременно лижи клитор. Ноги у неё разведены, она не отстраняется.',s:240,up:[[1,'Чёрный дилдо вместо фиолетового.'],[2,'В ней железная пробка.'],[3,'Кончать нельзя.'],[4,'Пробка чёрная, с вибрацией.']]},
{k:'him',l:2,n:'На сосках',t:'Прижимай перкуссионный вибратор к соскам по очереди. Меняй скорость. Киски не касаешься.',s:180,up:[[1,'Руки связаны над головой.'],[2,'В ней железная пробка.'],[3,'Кончать нельзя.'],[4,'В ней чёрный дилдо.']]},
{k:'him',l:2,n:'Стек гладит',t:'Веди стеком по телу медленно, как лаской. Без предупреждения шлёпай, потом снова гладь. Она не знает, когда.',s:180,up:US},
{k:'him',l:2,n:'Шестьдесят девять',oral:1,face:1,t:'Ляг на спину и посади её сверху лицом к своим ногам. Ты лижешь, она сосёт. Остановилась — останавливаешься и ты.',alt:'Вместо минета она сосёт твои пальцы или дрочит рукой.',s:240,up:[[1,'В ней железная пробка.'],[2,'Два пальца внутри.'],[3,'Кончать нельзя.'],[4,'Пробка чёрная, с вибрацией.']]},
{k:'him',l:2,n:'Держи сзади',t:'Обхвати её сзади, прижав её руки к телу, и не отпускай. Свободной рукой ласкай, как хочешь. Вырваться она не может.',s:180,up:UH},
{k:'him',l:2,n:'В её руки',t:'Свяжи ей руки спереди, вложи в них член и двигайся сам. Она только держит и не отпускает.',s:180,bind:1,up:UH},
{k:'him',l:2,n:'Между бёдер',t:'Смажь ей бёдра, ляг сзади и двигайся между сомкнутых бёдер, скользя по киске. Внутрь не входишь.',s:240,up:[[1,'Руки связаны за спиной.'],[2,'В ней железная пробка.'],[3,'На ней белый вибратор.'],[4,'Кончать ей нельзя.']]},
{k:'him',l:2,n:'Распорка',t:'Привяжи палку к её лодыжкам так, чтобы ноги не смыкались. Ласкай её как хочешь: свести колени она больше не может.',s:300,up:UH},
{k:'him',l:2,n:'Ноги вместе',t:'Свяжи ей ноги вместе: у щиколоток и над коленями. Просунь вибратор между бёдер и включи. Раздвинуть ноги она не может.',s:240,up:[[1,'Руки связаны за спиной.'],[2,'В ней железная пробка.'],[3,'Кончать нельзя.'],[4,'Пробка чёрная, с вибрацией.']]},
{k:'him',l:2,n:'Кандалы',t:'Застегни мягкие кандалы на лодыжках, разведи ноги и закрепи их у краёв кровати. Лижи и ласкай её.',s:300,up:UH},
{k:'him',l:2,n:'Дилдо и перкуссия',t:'Вставь в неё фиолетовый дилдо и держи снаружи перкуссионный вибратор. Двигай дилдо одной рукой, вибратор держи другой.',s:240,up:[[1,'Чёрный дилдо вместо фиолетового.'],[2,'В ней железная пробка.'],[3,'Кончать нельзя.'],[4,'Пробка чёрная, с вибрацией.']]},
{k:'him',l:2,n:'Яйцо',t:'Выверни яйцо Tenga внутренней стороной наружу, смажь и ласкай ей клитор и всё вокруг. Она не знает, что это.',s:180,up:[[1,'В ней два пальца.'],[2,'В ней железная пробка.'],[3,'Кончать нельзя.'],[4,'Пробка чёрная, с вибрацией.']]},
{k:'him',l:2,n:'Оближи всю',t:'Оближи её всю, медленно и не пропуская: шею, грудь, живот, спину, ягодицы, бёдра, ступни.',s:240,up:UH},
{k:'him',l:2,n:'Анилингус',anal:1,t:'Поставь её на колени, грудь на кровать, и лижи ей задницу: медленно, языком, снаружи.',s:240,up:[[1,'Рукой ласкай киску.'],[2,'Она сама разводит ягодицы руками на максимум.'],[3,'На ней пингвин.'],[4,'Кончать нельзя.']]},
{k:'him',l:2,n:'Три пальца',t:'Вставь в неё три пальца и двигай ими, другой рукой держи за бедро. Она не отстраняется.',s:210,up:UH},
{k:'him',l:2,n:'Язык наружу',oral:1,t:'Она стоит на коленях с высунутым языком и ждёт. Положи член ей на язык и постукивай им. Она не убирает язык.',s:90,up:[[1,'Руки связаны за спиной.'],[2,'В ней железная пробка.'],[3,'На ней белый вибратор.'],[4,'Кончать ей нельзя.']]},
{k:'him',l:2,n:'Твой язык',t:'Поцелуй её и засунь язык ей в рот, глубоко. Она не отстраняется и не закрывает рот, пока идёт таймер.',s:60,up:[[1,'Твои пальцы в её киске.'],[2,'В ней железная пробка.'],[3,'На ней белый вибратор.'],[4,'Кончать ей нельзя.']]},
{k:'him',l:2,n:'Язык и пальцы',t:'Держи её за волосы, засунь язык ей в рот и двигай пальцами в её киске. Отстранилась — наказание.',s:120,up:UH},
{k:'him',l:1,n:'Смотри и дрочи',t:'Поставь её в позу: на колени, ноги широко, язык наружу. Дрочи рядом, кончать не обязательно. Она не двигается.',s:150,up:[[1,'Вставляй ей пальцы, когда захочешь.'],[2,'В ней железная пробка.'],[3,'На ней белый вибратор.'],[4,'Кончать ей нельзя.']]},
{k:'him',l:2,n:'Дрочи и пальцы',t:'Дрочи одной рукой, а пальцами другой двигай в её киске. Кончать не обязательно. Она держит ноги разведёнными.',s:180,up:UH},
{k:'him',l:2,n:'На связанную',t:'Свяжи ей руки и разведи ноги. Дрочи над ней и другой рукой ласкай её. Кончать не обязательно, ей нельзя.',s:210,bind:1,up:[[1,'В ней фиолетовый дилдо.'],[2,'В ней железная пробка.'],[3,'На сосках зажимы.'],[4,'Пробка чёрная, с вибрацией.']]},
{k:'him',l:2,n:'Руками на время',late:1,t:'Она дрочит тебе обеими руками и не останавливается, пока идёт таймер. Остановилась — наказание.',s:300,up:UH},
{k:'him',l:2,n:'Ножками на время',late:1,t:'Она дрочит тебе ступнями, а ты лежишь. Не останавливается, пока идёт таймер. Остановилась — наказание.',s:300,up:UH},
{k:'him',l:2,n:'Её ступнями',t:'Возьми её ступни и дрочи ими себе сам. Она лежит и не помогает, ноги не убирает.',s:180,up:UH},
{k:'him',l:3,n:'Вибратором на время',late:1,t:'Она ласкает твой член белым или перкуссионным вибратором и рукой, пока идёт таймер. Остановилась — наказание.',s:300,up:[[1,'В ней железная пробка.'],[2,'В ней фиолетовый дилдо.'],[3,'Кончать ей нельзя.'],[4,'Чёрный дилдо вместо фиолетового.']]},
{k:'him',l:2,n:'Её вкус',t:'Введи в неё пальцы, вытащи и заставь её облизать их дочиста. Повторяй, пока идёт таймер.',s:120,up:UH},
{k:'him',l:2,n:'Верёвка между ног',t:'Обвяжи ей талию и протяни верёвку между ног, завязав узел прямо на клиторе. Натягивай, отпускай, двигай её.',s:180,up:[[1,'Руки связаны за спиной.'],[2,'В ней железная пробка.'],[3,'Кончать нельзя.'],[4,'На сосках зажимы.']]},
{k:'him',l:2,n:'Как куклу',t:'Расставляй её как куклу: сам двигай руки, ноги, голову. Она держит каждую позу, пока ты не поменяешь её сам. Сдвинулась — шлепок.',s:180,up:UH},
{k:'him',l:2,n:'Куни',t:'Сделай ей куни. Она лежит неподвижно. Дёрнулась — останавливаешься и начинаешь дразнить заново.',s:300,up:[[1,'Руки привязаны над головой.'],[2,'В ней железная пробка.'],[3,'Два пальца внутри, двигай ими в такт.'],[4,'Кончать только по твоему слову.']]},
{k:'him',l:2,n:'Двадцать',t:'Двадцать шлепков, по очереди на каждую ягодицу. Она считает вслух.',up:US},
{k:'him',l:2,n:'За спиной',t:'Свяжи ей запястья за спиной и поставь на колени. Целуй, кусай и ласкай всё тело. Она может только просить.',s:240,bind:1,up:UH},
{k:'him',l:2,n:'К изголовью',t:'Привяжи ей запястья к изголовью и закрепи ремнями белый вибратор. Меняй мощность, когда захочешь.',s:300,bind:1,up:[[1,'В ней железная пробка.'],[2,'В ней фиолетовый дилдо.'],[3,'Кончать нельзя.'],[4,'Чёрный дилдо и чёрная пробка с вибрацией, на сосках зажимы.']]},
{k:'him',l:2,n:'Без предупреждения',t:'Ласкай её белым вибратором без предупреждения: включай, убирай, возвращай. Она не должна знать, когда будет следующее касание.',s:240,up:UH},
{k:'him',l:2,n:'Внутри',t:'Ласкай её двумя пальцами изнутри, другой рукой держи за бедро. Она не должна отстраняться.',s:210,up:UH},
{k:'him',l:2,n:'Последний момент',t:'Ласкай её пингвином. Как только скажет «близко», сразу убирай. Повтори четыре раза. Кончила — наказание.',s:360,up:[[1,'В ней фиолетовый дилдо.'],[2,'Пять раз.'],[3,'В ней чёрный дилдо.'],[4,'Шесть раз и чёрная пробка с вибрацией.']]},
{k:'him',l:2,n:'Три раза',t:'Рукой или ртом доведи её почти до оргазма и остановись в последнюю секунду. Между разами ласкай только соски и тело. Повтори три раза. Кончать нельзя.',s:360,up:[[1,'С пингвином.'],[2,'С фиолетовым дилдо внутри.'],[3,'Четыре раза.'],[4,'Пять раз, с пробкой.']]},
{k:'him',l:2,n:'Прижать',t:'Положи её на живот, прижми своим весом и держи запястья. Свободной рукой делай что хочешь.',s:210,up:UH},
{k:'him',l:2,n:'Пятнадцать',t:'Пятнадцать ударов стеком по ягодицам. Начни легко, потом сильнее.',up:US},
{k:'him',l:2,n:'По груди',t:'Шлёпай её стеком по груди: начни с лёгких и усиливай по реакции. Она держит грудь вперёд и не отстраняется.',s:120,up:US},
{k:'him',l:2,n:'По киске',t:'Разведи ей ноги и шлёпай ладонью по киске: коротко и ритмично. Чередуй с пальцами.',s:120,up:[[1,'В ней железная пробка.'],[2,'Иногда прижимай белый вибратор.'],[3,'Часть шлепков стеком.'],[4,'Пробка чёрная, с вибрацией. Она считает вслух.']]},
{k:'him',l:2,n:'Пальцы сзади',anal:1,t:'Смажь пальцы и войди ей в задницу сначала одним, потом двумя. Другая рука ласкает киску.',s:210,up:[[1,'Пингвин вместо второй руки.'],[2,'В киске фиолетовый дилдо.'],[3,'Кончать нельзя.'],[4,'Чёрный дилдо вместо фиолетового.']]},
{k:'him',l:2,n:'Шарики сзади',t:'Смажь стеклянную пробку и вводи её в задницу шарик за шариком, потом медленно вынимай. Повторяй.',s:180,up:[[1,'Пингвин на ней.'],[2,'В киске фиолетовый дилдо.'],[3,'Кончать нельзя.'],[4,'Зажимы на сосках.']]},
{k:'him',l:2,n:'Зажимы и язык',t:'Надень ей зажимы на соски и сделай куни.',s:240,up:[[1,'Тяни за зажимы, пока работаешь языком.'],[2,'В ней фиолетовый дилдо.'],[3,'В ней ещё и железная пробка.'],[4,'Кончать нельзя, а зажимы снимаешь в конце.']]},
{k:'him',l:2,n:'К стулу',t:'Посади её на стул, заведи руки за спинку и свяжи, разведи ноги. Ласкай пингвином. Она не может свести колени.',s:300,bind:1,up:[[1,'Лодыжки привязаны к ножкам стула.'],[2,'На сосках зажимы.'],[3,'В ней железная пробка.'],[4,'Кончать только по твоему слову, стек по бёдрам, если нарушит.']]},
{k:'him',l:2,n:'На твоём лице',t:'Ляг на спину и прикажи ей сесть тебе на лицо. Держи за бёдра и не давай подняться.',s:240,face:1,up:[[1,'Вставь пальцы.'],[2,'В ней железная пробка.'],[3,'Руки у неё связаны за спиной.'],[4,'Не отпускай до конца, даже если она кончила.']]},
{k:'him',l:2,n:'Дилдо твоей рукой',t:'Двигай в ней фиолетовым дилдо своей рукой, а её рука держит твой член. Отпустила — останавливаешься и начинаешь заново.',s:240,up:[[1,'Чёрный дилдо вместо фиолетового.'],[2,'В ней железная пробка.'],[3,'На ней перкуссионный вибратор.'],[4,'Кончать нельзя.']]},

{k:'him',l:2,n:'Только соски',t:'Ласкай только соски и тело: ртом, пальцами, зубами. Киску не трогаешь, даже если она просит.',s:240,up:[[1,'Руки связаны над головой.'],[2,'В ней железная пробка.'],[3,'Пробка чёрная, вибрация не выключается.'],[4,'Кончать нельзя до конца следующей карты.']]},
{k:'him',l:2,n:'Лёгкие зажимы',t:'Прицепи зажимы на половые губы и разведи ей ноги. Ласкай вокруг, не снимая их до конца таймера.',s:150,up:[[1,'На сосках тоже зажимы.'],[2,'В ней железная пробка.'],[3,'Шлёпай ладонью по бёдрам.'],[4,'Пингвин рядом: подноси и убирай.']]},
{k:'him',l:2,n:'Стоя у стены',t:'Поставь её лицом к стене, свяжи руки за спиной и разведи ей ноги. Шлёпай и ласкай сзади.',s:210,bind:1,up:US},

/* ---------- ДЛЯ НЕГО: этап 3 ---------- */
{k:'him',l:3,n:'На боку',anal:1,as:1,t:'Ляг сзади неё на бок, смажь и войди ей в попку. Двигайся медленно и глубоко, пальцами ласкай клитор. Она держит верхнюю ногу поднятой.',s:300,up:UF},
{k:'him',l:3,n:'Попка и пингвин',anal:1,as:1,t:'Трахай её в попку, а пингвин прижат к её клитору. Не останавливайся, даже когда она кончит.',s:300,up:UH},
{k:'him',l:3,n:'Лёд на грани',t:'Доведи её пингвином до самого края — и в последний момент прижми кубик льда к внутренней стороне бедра. Три раза. Кончать нельзя.',s:300,up:UH},
{k:'him',l:3,n:'На выдохе',t:'Ласкай её пальцами и языком до грани. На краю скажи «не дыши» — она задерживает дыхание, пока ты считаешь до десяти. Отпускаешь её только на выдохе. Три раза.',s:300,up:UF},
{k:'him',l:3,n:'Только руки',t:'Доведи её до оргазма только руками: пальцы внутри, другая рука на клиторе. После оргазма не останавливайся, пока идёт таймер.',s:300,up:UF},
{k:'him',l:3,n:'Пальцы и рот',t:'Пальцы одной руки — в её киске, пальцы другой — у неё во рту. Двигай обеими в одном темпе. Выпустила пальцы изо рта — начинаешь заново.',s:240,up:UH},
{k:'him',l:3,n:'Вытянуть на грани',t:'Введи ей сзади все четыре шарика. Доведи её пингвином до самого края — и ровно в этот момент медленно вытягивай шарики, по одному.',s:300,up:[[1,'Вторые шарики в киске.'],[2,'Руки и ноги зафиксированы.'],[3,'Повтори дважды: вставляешь заново и снова на грани.'],[4,'После этого ей нельзя кончать до конца игры.']]},
{k:'him',l:3,n:'Обе дырочки',t:'Одни шарики в киску, другие в попку. Ласкай её пингвином. В конце вынимай по шарику — то спереди, то сзади, по очереди, медленно.',s:300,up:[[1,'Руки связаны.'],[2,'Кончать только после последнего шарика.'],[3,'На сосках зажимы.'],[4,'Не останавливайся и после оргазма, пока не вынешь последний.']]},
{k:'him',l:3,n:'Между ягодиц',t:'Смажь и двигайся между её ягодиц, не входя. Держи за бёдра или связанные руки, темп твой.',s:240,up:[[1,'На ней белый вибратор.'],[2,'В киске фиолетовый дилдо.'],[3,'Шлёпай её в процессе.'],[4,'Чёрный дилдо вместо фиолетового.']]},
{k:'him',l:3,n:'Обе руки',anal:1,t:'Смажь пальцы. Одна рука в киске, другая в заднице, двигай ими то вместе, то по очереди.',s:210,up:[[1,'На ней белый вибратор.'],[2,'Руки связаны за спиной.'],[3,'Кончать нельзя.'],[4,'На сосках зажимы.']]},
{k:'him',l:3,n:'Тридцать на тридцать',t:'Тридцать секунд пингвин на полной мощности, тридцать секунд ничего. Считай сам и не сбивайся. Кончила — наказание.',s:360,up:[[1,'В ней фиолетовый дилдо.'],[2,'В ней железная пробка.'],[3,'Сорок секунд работы и двадцать паузы.'],[4,'Чёрный дилдо и чёрная пробка с вибрацией.']]},
{k:'him',l:3,n:'Смена игрушек',t:'Каждую минуту меняй: белый, пингвин, перкуссионный, твой рот. Она не знает, что будет следующим. Кончать нельзя.',s:300,up:[[1,'В ней фиолетовый дилдо.'],[2,'В ней железная пробка.'],[3,'Чёрный дилдо вместо фиолетового.'],[4,'На сосках зажимы.']]},
{k:'him',l:3,n:'Десять и тридцать',t:'Десять шлепков, потом тридцать секунд перкуссионным вибратором. И снова по кругу, пока идёт таймер.',s:300,up:US},
{k:'him',l:3,n:'Лягушка',t:'Согни ей ноги и привяжи каждую голень к бедру. Разведи колени в стороны. Ласкай дилдо и вибратором: она раскрыта и свести ноги не может.',s:300,up:[[1,'Чёрный дилдо вместо фиолетового.'],[2,'В ней железная пробка.'],[3,'Кончать нельзя.'],[4,'На сосках зажимы.']]},
{k:'him',l:3,n:'Спереди',t:'Посади её и привяжи запястья к лодыжкам спереди, ноги разведены. Опрокинь на спину и ласкай пингвином.',s:240,bind:1,up:UH},
{k:'him',l:3,n:'Сзади',t:'Положи её на бок, свяжи руки за спиной и подтяни лодыжки к запястьям. Ласкай пальцами и вибратором.',s:180,bind:1,up:[[1,'В ней железная пробка.'],[2,'Вибратор на максимуме.'],[3,'Кончать нельзя.'],[4,'На сосках зажимы.']]},
{k:'him',l:3,n:'Обратный отсчёт',t:'Ласкай её вибратором и считай вслух от двадцати до нуля. Кончить можно только на ноль. Раньше — наказание. Не успела — тоже.',s:120,up:[[1,'От тридцати, и ты можешь останавливать счёт.'],[2,'В ней фиолетовый дилдо.'],[3,'Два раунда подряд.'],[4,'Чёрный дилдо и чёрная пробка с вибрацией.']]},
{k:'him',l:3,n:'Решаешь ты',t:'Ласкай её пингвином. Она обязана предупредить словами «хозяин, я сейчас кончу». Каждый раз решаешь сам: убрать или разрешить. Не предупредила — наказание.',s:360,up:[[1,'Первые два раза убираешь.'],[2,'В ней фиолетовый дилдо.'],[3,'Чёрный дилдо вместо фиолетового.'],[4,'В ней ещё и чёрная пробка с вибрацией.']]},
{k:'him',l:3,n:'После грани',t:'Доведи её пингвином до предела и убери его. Теперь только соски и тело, киску не трогаешь. Потом снова пингвин. Кончать нельзя.',s:420,up:[[1,'Руки связаны.'],[2,'В ней железная пробка.'],[3,'На сосках зажимы между гранями.'],[4,'Кончать нельзя ещё и следующую карту.']]},
{k:'him',l:3,n:'На клитор',t:'Прицепи лёгкий зажим на клитор. Лижи вокруг и не убирай его до конца таймера. Снимаешь сам и сразу лижешь.',s:90,up:[[1,'На половых губах тоже зажимы.'],[2,'В ней железная пробка.'],[3,'Руки связаны.'],[4,'На сосках тоже зажимы.']]},
{k:'him',l:3,n:'Руки над головой',t:'Поставь её стоя, свяжи руки и держи их над её головой. Свободной рукой ласкай пингвином. Колени подогнулись — наказание.',s:240,bind:1,up:UH},
{k:'him',l:3,n:'Стоя с дилдо',t:'Она стоит, опираясь на спинку стула, ноги широко. Ты сзади двигаешь в ней чёрным дилдо, насколько входит.',s:240,up:[[1,'Держи её за волосы.'],[2,'В ней железная пробка.'],[3,'Шлёпай в процессе.'],[4,'На сосках зажимы.']]},
{k:'him',l:3,n:'Десять минут',legs:1,t:'Закрепи ей руки и ноги, закрепи белый вибратор и оставайся рядом. Убрать его она не может. Меняй мощность.',s:600,bind:1,up:[[1,'В ней железная пробка.'],[2,'На сосках зажимы.'],[3,'В ней фиолетовый дилдо, пробка чёрная.'],[4,'Кончать только по твоему слову, а после этого не выключаешь.']]},
{k:'him',l:3,n:'Выдержи',legs:1,t:'Зафиксируй её и держи пингвина на высокой мощности. Кончать нельзя, пока идёт таймер. Кончила — проиграла: жми «Наказание».',s:240,bind:1,up:[[1,'В ней фиолетовый дилдо.'],[2,'В ней железная пробка.'],[3,'Чёрный дилдо вместо фиолетового.'],[4,'Пробка чёрная, с вибрацией.']]},
{k:'him',l:3,n:'Не останавливайся',t:'Доведи её до оргазма ртом или вибратором и продолжай после него, пока не выйдет время.',s:300,up:[[1,'В ней железная пробка.'],[2,'Два оргазма.'],[3,'Руки и ноги зафиксированы.'],[4,'Три оргазма подряд.']]},
{k:'him',l:3,n:'Пять раз',t:'Доводи её до грани пять раз подряд и останавливайся в последний момент. Кончить разрешаешь только после пятого, и когда она попросит.',s:480,up:[[1,'С железной пробкой внутри.'],[2,'С зажимами.'],[3,'Семь раз.'],[4,'После седьмого не разрешаешь: запрет остаётся.']]},
{k:'him',l:3,n:'Запрет до конца',t:'Объяви ей: кончать нельзя до конца игры. За оргазм без разрешения — наказание.',ban:99},
{k:'him',l:3,n:'Тридцать',t:'Тридцать шлепков с нарастанием. Каждый десяток она благодарит хозяина и просит следующий.',up:US},
{k:'him',l:3,n:'Грудь и киска',t:'Она лежит на спине с разведёнными ногами. Стеком по груди и по киске, чередуй. Она считает до двадцати.',up:US},
{k:'him',l:3,n:'Чёрным сзади',t:'Поставь её на колени спиной к себе и двигай в ней чёрным дилдо, насколько входит. Держи за бёдра или связанные руки. Темп твой.',s:300,up:[[1,'К ней прижат перкуссионный вибратор.'],[2,'В ней железная пробка.'],[3,'Шлёпай её в процессе.'],[4,'На сосках зажимы.']]},
{k:'him',l:3,n:'На стуле',t:'Сядь на стул и посади её к себе спиной на колени. Двигай в ней фиолетовым дилдо, другой рукой держи за волосы. Её рука держит твой член, отпускать нельзя.',s:300,up:[[1,'Чёрный дилдо вместо фиолетового.'],[2,'В ней железная пробка.'],[3,'На сосках зажимы.'],[4,'Пробка чёрная, с вибрацией.']]},
{k:'him',l:3,n:'В рот',oral:1,t:'Пусть она сделает тебе минет, а ты держишь её за связанные руки. Темп только твой.',alt:'Двигай пальцами у неё во рту, держа её за связанные руки. Выпустила — наказание.',s:240,up:UH},
{k:'him',l:3,n:'Рот и дилдо',oral:1,t:'Двигай в ней дилдо, а она сосёт твои пальцы или член. Выпустила — ты останавливаешься, а она получает наказание.',alt:'Два пальца у неё во рту, двигаешь ими сам.',s:300,up:[[1,'Чёрный дилдо вместо фиолетового.'],[2,'В ней железная пробка.'],[3,'Кончать нельзя.'],[4,'Пробка чёрная, с вибрацией, зажимы на сосках.']]},
{k:'him',l:3,n:'К лодыжкам',t:'Поставь её на колени и привяжи запястья к лодыжкам. Ласкай её как хочешь: она открыта и никуда не денется.',s:300,bind:1,up:UH},
{k:'him',l:3,n:'Осмотр',t:'Поставь её стоя и осмотри как вещь: раскрывай пальцами, поворачивай, наклоняй, ставь в нужные позы. Она не видит, куда ты смотришь, и не знает, что будет дальше. Сопротивлялась — наказание.',s:240,up:UH},
{k:'him',l:3,n:'Яйцом до грани',t:'Яйцом Tenga, вывернутым наизнанку, доведи её до грани и убери. Так три раза. Кончать нельзя.',s:300,up:[[1,'В ней фиолетовый дилдо.'],[2,'В ней железная пробка.'],[3,'Четыре раза.'],[4,'Чёрный дилдо вместо фиолетового.']]},
{k:'him',l:3,n:'Всё языком',anal:1,t:'Чередуй куни и анилингус: минута там, минута там. Она держит позу и не отстраняется.',s:300,up:[[1,'Она сама разводит ягодицы руками на максимум.'],[2,'В киске два пальца.'],[3,'Кончать нельзя.'],[4,'На сосках зажимы.']]},
{k:'him',l:3,n:'По лицу',oral:1,t:'Она стоит на коленях с высунутым языком. Хлопай членом по её щекам и языку. Она не уклоняется и не закрывает рот.',s:90,up:[[1,'Руки связаны за спиной.'],[2,'В ней железная пробка.'],[3,'На ней белый вибратор.'],[4,'На сосках зажимы.']]},
{k:'him',l:3,n:'В задницу',anal:1,as:1,t:'Смажь и трахни её в задницу, медленно и неглубоко сначала.',alt:'То же самое двумя пальцами.',s:240,up:[[1,'На ней белый вибратор.'],[2,'В киске фиолетовый дилдо.'],[3,'Шлёпай её в процессе.'],[4,'Чёрный дилдо вместо фиолетового.']]},
{k:'him',l:3,n:'Связанную в задницу',anal:1,as:1,t:'Поставь её на колени, свяжи руки за спиной, смажь и войди в задницу. Держи за связанные руки, темп твой.',alt:'То же самое двумя пальцами, другой рукой держи за связанные руки.',s:240,bind:1,up:[[1,'На ней пингвин.'],[2,'В киске фиолетовый дилдо.'],[3,'Кончать нельзя.'],[4,'На сосках зажимы.']]},
{k:'him',l:3,n:'Вместе',late:1,t:'Цель — кончить вместе. Ласкай её и дрочи себе. Она обязана сказать, когда близко. Если обгоняет тебя — останови ласки и догоняй. Кончила раньше — наказание.',s:600,up:[[1,'В ней фиолетовый дилдо.'],[2,'В ней железная пробка.'],[3,'Чёрный дилдо вместо фиолетового.'],[4,'Пробка чёрная, с вибрацией.']]},
{k:'him',l:3,n:'Рядом',late:1,t:'Она сидит на коленях, язык высунут, и не убирает его. Дрочи рядом, пока идёт таймер, и вставляй ей пальцы, когда захочешь. Если кончишь, то рядом с ней, не на неё.',s:240,up:[[1,'Руки связаны за спиной.'],[2,'В ней железная пробка.'],[3,'На ней белый вибратор.'],[4,'Кончать ей нельзя.']]},
{k:'him',l:3,n:'Куни до конца',t:'Сделай ей куни и доведи до оргазма за время таймера. Не успел — начинаешь заново.',s:480,up:[[1,'В ней железная пробка.'],[2,'Руки зафиксированы.'],[3,'Не останавливайся сразу после.'],[4,'До второго оргазма.']]},

/* ---------- НАКАЗАНИЯ: уровень зависит от числа узлов ---------- */
{k:'punish',tier:2,n:'Холод на спине',t:'Она стоит на четвереньках, на пояснице кубик льда. Держит, пока не растает. Уронила — десять шлепков и новый кубик.',s:240},
{k:'punish',tier:2,n:'Держи шарики',t:'Четыре шарика сзади. Она стоит на коленях, руки за головой, и держит их в себе. Выскользнул шарик — пять шлепков и заново.',s:180},
{k:'punish',tier:4,n:'Восемь шариков',t:'Шарики в обеих дырочках. Двадцать шлепков. На каждом пятом он медленно вытягивает по шарику, а она благодарит.'},
{k:'punish',tier:0,n:'Сама себя',t:'Она десять раз шлёпает себя ладонью по ягодицам и считает вслух. Слабо — он добавляет своими.'},
{k:'punish',tier:1,n:'Дилдо в зубах',t:'На коленях, фиолетовый дилдо в зубах, без рук. Он шлёпает её, пока идёт таймер. Выронила — заново.',s:120},
{k:'punish',tier:2,n:'Оближи дочиста',t:'Она вынимает из себя фиолетовый дилдо и облизывает. Три раза, и каждый раз получает пять шлепков.'},
{k:'punish',tier:3,n:'На цыпочках',t:'На цыпочках, ноги широко, в ней чёрный дилдо. Опустила пятки или выронила — удар стеком.',s:240},
{k:'punish',tier:4,n:'Круги',t:'Пять кругов: минута пингвин, минута стек. Кончать нельзя. Кончила — ещё круг.',s:600},
{k:'punish',tier:5,n:'Без остановки',t:'Чёрный дилдо, чёрная пробка с вибрацией и перкуссионный вибратор снаружи. Два оргазма обязательны, третий решает хозяин.',s:720},
{k:'punish',tier:0,n:'Счёт',t:'Он даёт двадцать шлепков. Она считает вслух, сбилась — заново.'},
{k:'punish',tier:0,n:'Язык',t:'Она стоит на коленях с высунутым языком лицом к нему. Убрала — время начинается заново.',s:120},
{k:'punish',tier:0,n:'Лицом к стене',t:'Она стоит на коленях лицом к стене, широко разведя колени. Он в любой момент подходит и шлёпает.',s:120},
{k:'punish',tier:0,n:'Запрет',t:'Кончать нельзя ещё три карты. Кончила — ещё один узел.',ban:3},

{k:'punish',tier:1,n:'С пробкой',t:'Он вставляет железную пробку и даёт двадцать пять шлепков. Она считает вслух и говорит «спасибо, хозяин» после каждого пятого.'},
{k:'punish',tier:1,n:'Зажимы',t:'Зажимы на соски, руки за головой. Она стоит на коленях и не двигается.',s:180},
{k:'punish',tier:1,n:'Открытый рот',t:'На коленях с открытым ртом. Он двигает пальцами у неё во рту. Выпустила — ещё минута.',s:180},
{k:'punish',tier:1,n:'Ползком',t:'Она ползёт к нему и целует его руку, пока он её шлёпает. Остановилась — ещё десять.',s:120},

{k:'punish',tier:2,n:'С игрушкой внутри',t:'В ней фиолетовый дилдо. Он даёт тридцать шлепков, а игрушка должна оставаться на месте. Выпала — заново.'},
{k:'punish',tier:2,n:'Три грани',t:'Он трижды доводит её до грани пингвином и в последний момент убирает его. Кончать нельзя ещё три карты.',s:360,ban:3},
{k:'punish',tier:2,n:'Стыдная поза',t:'На спине, колени к груди и в стороны. Она держит позу, а он рассматривает и трогает, что хочет. Опустила ноги — заново.',s:240},
{k:'punish',tier:2,n:'Зажимы и стек',t:'Зажимы на соски. Двадцать ударов стеком. После каждого — «спасибо, хозяин».'},

{k:'punish',tier:3,n:'Сорок',t:'В ней чёрная пробка с вибрацией, на ней белый вибратор. Сорок ударов стеком. Она считает и благодарит. Кончать нельзя.'},
{k:'punish',tier:3,n:'Пять граней',t:'Он пять раз доводит её до грани: рукой, ртом, пингвином, как хочет. Кончать нельзя. Запрет остаётся до конца игры.',s:480,ban:99},
{k:'punish',tier:3,n:'Привязанная',legs:1,t:'Руки и ноги закреплены, белый вибратор на максимуме, в ней чёрный дилдо. Он рядом и решает, когда сменить мощность. Кончать нельзя.',s:480},
{k:'punish',tier:3,n:'Стек по киске',legs:1,t:'На спине, ноги разведены и закреплены. Двадцать ударов стеком по груди и по киске. Она просит каждый следующий.'},

{k:'punish',tier:3,n:'Зажимы внизу',t:'Зажимы на половые губы и клитор. Она стоит на коленях, разведя ноги, и не двигается. Снимает он.',s:120},

{k:'punish',tier:4,n:'Сорок пять',t:'На коленях, чёрный дилдо внутри, обе руки держат его член. Сорок пять ударов. Отпустила — плюс десять. Считает и благодарит.'},
{k:'punish',tier:4,n:'Шесть граней',t:'Привязана к стулу, ноги разведены. Он шесть раз доводит её до грани пингвином. Кончать нельзя до конца игры.',s:540,bind:1,ban:99},
{k:'punish',tier:4,n:'Рабочие ноги',t:'Дрочит ему ступнями, пока на ней работает белый вибратор, а в ней чёрная пробка с вибрацией. Остановилась — удар стеком.',s:360},
{k:'punish',tier:4,n:'Рот занят',t:'Она сосёт его пальцы или член, не выпуская, а он шлёпает её стеком по заду и груди. Выпустила — время заново.',s:300},

{k:'punish',tier:5,n:'Три подряд',legs:1,t:'Руки и ноги закреплены, в ней чёрная пробка с вибрацией, на сосках зажимы. Три оргазма подряд от пингвина, без паузы и остановки.',s:900},
{k:'punish',tier:5,n:'Пятьдесят',t:'Пятьдесят ударов: чёрная пробка и чёрный дилдо внутри, зажимы на сосках. Считает вслух, благодарит хозяина за каждый. Сбилась — плюс десять.'},
{k:'punish',tier:5,n:'Весь вечер',t:'Запрет на оргазм до конца игры. Пробка остаётся. Семь раз он доводит её до грани. Перед каждой гранью она просит следующую.',s:720,ban:99},
{k:'punish',tier:5,n:'Полная программа',t:'Зажимы, чёрная пробка, чёрный дилдо, белый вибратор. Она на коленях, руки за спиной, рот открыт для его пальцев или члена. Хозяин решает, когда это закончится.',s:600}
];

/* Цена паузы: when — before (сделать до паузы) или after (следующая карта после паузы) */
const PRICES = [
{when:'before',t:'Встань на колени, разведи ноги и раскрой себя пальцами. Держи так, пока он не скажет «хватит».'},
{when:'before',t:'Подползи к нему и поцелуй обе его ладони. Только потом получишь паузу.'},

/* Два чёрных дилдо сменяют друг друга; на каждой третьей карте пингвина заменяет перкуссионный вибратор */
function flavour(text,i){
  /* Иногда вместо железной пробки — анальные шарики */
  if(i%4===1) text = text.replace(/железная пробка/g,'анальные шарики, все четыре').replace(/железную пробку/g,'анальные шарики');
  if(i%3===2){
    text = text
      .replace(/от пингвина/g,'от перкуссионного вибратора')
      .replace(/Пингвин/g,'Перкуссионный вибратор')
      .replace(/пингвином/g,'перкуссионным вибратором')
      .replace(/пингвина|пингвин/g,'перкуссионный вибратор');
  }
  const ribbed = i%2===0;
  const forms = ribbed
    ? {'Чёрный дилдо':'Ребристый чёрный дилдо','чёрный дилдо':'ребристый чёрный дилдо','чёрным дилдо':'ребристым чёрным дилдо'}
    : {'Чёрный дилдо':'Чёрный дилдо-щупальце','чёрный дилдо':'чёрный дилдо-щупальце','чёрным дилдо':'чёрным дилдо-щупальцем'};
  return text.replace(/Чёрный дилдо|чёрный дилдо|чёрным дилдо/g, m=>forms[m]);
}

  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }

}

/* Трилистник — математический узел, им нарисованы логотип и рубашка карт */
function drawKnots(){
  let d='';
  for(let k=0;k<=240;k++){
    const t=k/240*Math.PI*2;
    const x=Math.sin(t)+2*Math.sin(2*t), y=Math.cos(t)-2*Math.cos(2*t);
    d+=(k?'L':'M')+x.toFixed(3)+' '+(-y+.45).toFixed(3);
  }
  $('#trefoilPath').setAttribute('d',d+'Z');
  const h=$('#heroPath'); h.setAttribute('d',d+'Z');
  try{
    const L=h.getTotalLength();
    h.style.strokeDasharray=L; h.style.strokeDashoffset=L;
    requestAnimationFrame(()=>requestAnimationFrame(()=>h.classList.add('draw')));
  }catch(e){ h.classList.add('draw'); }
}

/* Тема карты: по ней следим, чтобы в одной игре не было много похожих и они не шли подряд */
const isHand = c => c.up===UF || c.n==='Пальцы и рот' || c.n==='Обе руки' || c.n==='Пальцы в рот';
function tagOf(c){
  if(!c||!c.n||!c.t) return '';
  const s = (c.n+' '+c.t).toLowerCase();
  if(c.oral) return 'oral';
  if(c.as) return 'asex';
  if(c.anal) return 'anal';
  if(/лёд|льд|холодн/.test(s)) return 'ice';
  if(/шарик/.test(s)) return 'beads';
  if(isHand(c)) return 'hands';
  if(c.face) return 'face';
  if(/не дыши|дыхани/.test(s)) return 'breath';
  if(/шлеп|шлёп|удар|стек/.test(s)) return 'spank';
  if(/ступн|ножк/.test(s)) return 'feet';
  if(/поцел|целуй/.test(s)) return 'kiss';
  if(/член|дрочи/.test(s)) return 'cock';
  if(/зажим/.test(s)) return 'clamps';
  if(/свяж|привяж|закреп|кандал|верёвк|распорк/.test(s)) return 'bind';
  if(/грани|край|близко|последн/.test(s)) return 'edge';
  if(/дилдо/.test(s)) return 'dildo';
  if(/пингвин|вибратор|яйц/.test(s)) return 'vibe';
  if(/пальц/.test(s)) return 'fingers';
  if(/куни|лижи|язык/.test(s)) return 'tongue';
  return 'pose';
}
function buildQueue(){
  const len = settings.len;
  const counts = {1:Math.round(len*.3),3:Math.round(len*.3)};
  counts[2] = len-counts[1]-counts[3];
  const cap = Math.max(3,Math.ceil(len/7));
  const oralMax = len>=40 ? 3 : len>=28 ? 2 : 1;
  const q = [], used = new Set(), tagN = {};
  /* Чем чаще тема уже была, тем меньше шанс; одинаковые темы подряд почти не выпадают */
  const cost = c => {
    const t = tagOf(c), n = tagN[t]||0;
    let s = Math.random()*1.5 + n*1.4;
    if(q.length && tagOf(q[q.length-1])===t) s += 4;
    if(n>=cap) s += 60;
    if(c.oral && (tagN.oral||0)>=oralMax) s += 200;
    if((t==='ice'||t==='asex'||t==='breath') && n>=2) s += 60;
    if(t==='hands') s -= .8;
    return s;
  };
  for(const l of [1,2,3]){
    for(let n=0;n<counts[l];n++){
      const want = q.length%2===0 ? 'her' : 'him';
      let pool = CARDS.filter(c=>c.k===want&&c.l===l&&!c.late&&!used.has(c));
      if(!pool.length) pool = CARDS.filter(c=>(c.k==='her'||c.k==='him')&&c.l===l&&!c.late&&!used.has(c));
      if(!pool.length) break;
      let best = null, bs = 1e9;
      pool.forEach(c=>{ const s=cost(c); if(s<bs){ bs=s; best=c; } });
      q.push(best); used.add(best);
      const t = tagOf(best); tagN[t] = (tagN[t]||0)+1;
    }
  }
  q.push(FINAL);
  placeLate(q);
  ensureAnal(q);
  moreHands(q);
  capOral(q);
  addSecret(q);
  spreadTags(q);
  spaceFaces(q);
  q.unshift(THRESHOLD);
  return q;
}
/* В каждой игре есть анальный секс; в длинных — ещё и анальные ласки */
function ensureAnal(q){
  const swap = (test, levels) => {
    if(q.some(test)) return;
    const inQueue = new Set(q.map(c=>c.n));
    for(const pick of shuffle(CARDS.filter(x=>test(x)&&levels.includes(x.l)&&!inQueue.has(x.n)))){
      const spots = q.map((c,i)=>i).filter(i=>{ const c=q[i]; return c.k===pick.k&&c.l===pick.l&&!c.late&&!c.oral&&!c.anal&&c.k!=='secret'; });
      const i = shuffle(spots)[0];
      if(i!==undefined){ q[i] = pick; return; }
    }
  };
  swap(c=>c.as,[3]);
  if(settings.len>=28) swap(c=>c.anal&&!c.as,[2,3]);
}
/* Тайные карты: одна всегда врывается в случайный момент как лишняя карта,
   иногда ещё одна тихо подменяет обычную */
function addSecret(q){
  const pool = shuffle(SECRETS.slice());
  if(Math.random()<.4 && pool[1]){
    const spots = q.map((c,i)=>i).filter(i=>{ const c=q[i]; return (c.k==='her'||c.k==='him')&&c.l>=2&&!c.late&&!c.as&&tagOf(c)!=='hands'; });
    const i = shuffle(spots)[0];
    if(i!==undefined) q[i] = pool[1];
  }
  const at = Math.floor(q.length*(.3+Math.random()*.5));
  q.splice(at,0,Object.assign({extra:1},pool[0]));
}
/* Если две карты одной темы оказались рядом — меняем одну с картой того же этапа */
function spreadTags(q){
  const clash = k => { const t=tagOf(q[k]); return !!t && ((q[k-1]&&tagOf(q[k-1])===t)||(q[k+1]&&tagOf(q[k+1])===t)); };
  for(let i=1;i<q.length-1;i++){
    if(!tagOf(q[i]) || tagOf(q[i])!==tagOf(q[i-1]) || q[i].late) continue;
    for(let j=0;j<q.length-1;j++){
      if(Math.abs(j-i)<2||q[j].k!==q[i].k||q[j].l!==q[i].l||q[j].late||tagOf(q[j])===tagOf(q[i])) continue;
      [q[i],q[j]] = [q[j],q[i]];
      if(!clash(i)&&!clash(j)) break;
      [q[i],q[j]] = [q[j],q[i]];
    }
  }
}

function pickReward(){
  const used = game.rw||(game.rw=[]);
  const ok = r => !r.unknot||score>0;
  let pool = REWARDS.filter(r=>ok(r)&&!used.includes(r.n));
  const knot = pool.find(r=>r.unknot);
  if(knot && Math.random()<.45) pool = [knot];
  if(!pool.length) pool = REWARDS.filter(ok);
  const r = pool[Math.floor(Math.random()*pool.length)];
  used.push(r.n);
  return Object.assign({k:'reward'},r);
}

/* Карты, где работают с его членом или он может кончить: 1, 2 или 3 за игру по длине, равномерно начиная со второго этапа */
function placeLate(q){
  const inQueue = new Set(q.map(c=>c.n));
  q.forEach((c,i)=>{
    if(!c.late) return;
    const spare = shuffle(CARDS.filter(x=>x.k==='him'&&!x.late&&x.l===c.l&&!inQueue.has(x.n)))[0];
    if(spare){ q[i]=spare; inQueue.add(spare.n); }
  });
  const want = settings.len>=40 ? 3 : settings.len>=28 ? 2 : 1;
  const spots = q.map((c,i)=>c.k==='him'&&c.l>=2&&!c.late?i:-1).filter(i=>i>=0);
  /* «Вместе» есть в каждой игре и всегда идёт последней из этих карт */
  const together = CARDS.find(x=>x.n==='Вместе');
  const picks = shuffle(CARDS.filter(x=>x.late&&x!==together)).slice(0,want-1).concat(together);
  picks.forEach((card,j)=>{
    const spot = spots[Math.round((j+1)*spots.length/(picks.length+1))];
    if(spot!==undefined) q[spot]=card;
  });
}
/* Минетов немного: 1, 2 или 3 за игру по длине, остальные заменяются ласками того же этапа */
function capOral(q){
  const max = settings.len>=40 ? 3 : settings.len>=28 ? 2 : 1;
  const inQueue = new Set(q.map(c=>c.n));
  const idx = shuffle(q.map((c,i)=>c.oral?i:-1).filter(i=>i>=0)).slice(max);
  idx.forEach(i=>{
    const c = q[i];
    const spare = shuffle(CARDS.filter(x=>x.k===c.k&&x.l===c.l&&!x.oral&&!x.late&&!inQueue.has(x.n)))[0];
    if(spare){ q[i]=spare; inQueue.add(spare.n); }
  });
}
/* Его ласк руками больше: 2, 4 или 6 за игру по длине */
function moreHands(q){
  const isHand = c => c.up===UF || c.n==='Пальцы и рот' || c.n==='Обе руки' || c.n==='Пальцы в рот';
  const want = settings.len>=40 ? 6 : settings.len>=28 ? 4 : 2;
  let have = q.filter(isHand).length;
  const inQueue = new Set(q.map(c=>c.n));
  for(const i of shuffle(q.map((c,i)=>i))){
    if(have>=want) break;
    const c = q[i];
    if(c.k!=='him'||c.late||c.oral||c.anal||isHand(c)||c.n==='Вместе'||tagOf(c)==='ice') continue;
    const spare = shuffle(CARDS.filter(x=>isHand(x)&&x.l===c.l&&!inQueue.has(x.n)))[0];
    if(spare){ q[i]=spare; inQueue.add(spare.n); have++; }
  }
}
/* Карты с сидением на лице не идут подряд */
function spaceFaces(q){
  const safe = (j,card)=>!(card.face&&((q[j-1]&&q[j-1].face)||(q[j+1]&&q[j+1].face)));
  for(let i=1;i<q.length;i++){
    if(!(q[i].face&&q[i-1].face)) continue;
    const order = q.map((_,j)=>j).filter(j=>j>i||j<i-1).sort((a,b)=>Math.abs(a-i)-Math.abs(b-i));
    for(const j of order){
      if(q[j].k===q[i].k&&!q[j].face){
        const a=q[i], b=q[j];
        q[i]=b; q[j]=a;
        if(safe(j,a)) break;
        q[i]=a; q[j]=b;
      }
    }
  }
}
function startGame(){

/* Если её руки связаны, а карте нужны свободные — подбираем другую карту того же этапа */
function fitHands(){
  const c = game.q[game.i];
  if(!(settings.bound&&c.k==='her'&&c.h)) return;
  const inQueue = new Set(game.q.map(x=>x.n));
  const prev = game.q[game.i-1], next = game.q[game.i+1];
  const fits = x => !x.face||!((prev&&prev.face)||(next&&next.face));
  const spare = shuffle(CARDS.filter(x=>x.k==='her'&&!x.h&&!x.oral&&x.l===c.l&&!inQueue.has(x.n)&&fits(x)));
  if(spare.length){ game.q[game.i]=spare[0]; saveGame(); return; }
  for(let j=game.i+1;j<game.q.length;j++){
    const x = game.q[j];
    if(x.k==='her'&&!x.h&&x.l===c.l&&fits(x)&&!x.face){ game.q[j]=c; game.q[game.i]=x; saveGame(); return; }
  }
}

function advance(skipped){
  clearTimer();
  const c = game.q[game.i];
  const st=game.stats||(game.stats={done:0,skip:0,pun:0,k0:score});
  if(skipped) st.skip++; else if(!isExtra(c)) st.done++;
  Sound[skipped?'skip':'done']();
  if(!isExtra(c)&&game.ban>0&&game.ban<99) game.ban--;
  if(!skipped){
    if(c.bind) setBound(true);
    if(c.ban) game.ban = Math.max(game.ban,c.ban);
    if(c.unknot&&score>0){ setScore(score-1); toast('Узел развязан. Теперь '+score+' из '+MAX_KNOTS); }
    if(c.unban) game.ban = 0;
  }
  if(c.k==='her'||c.k==='him'){
    game.streak = skipped ? 0 : (game.streak||0)+1;
    if(game.streak>=OBEY){
      game.streak = 0;
      game.q.splice(game.i+1,0,pickReward());
      st.rew = (st.rew||0)+1;
      toast('Шесть карт без наказания — её ждёт поощрение');
    }
  }
  game.i++;
  saveGame();
  render();
}
function punish(){
  clearTimer();
  const tier = tierOf(score);
  /* Не повторяем наказания и не даём такие же, как карты этой игры; кончились — берём соседний уровень */
  const inGame = new Set(game.q.map(x=>x.n));
  const byTier = t => CARDS.map((c,i)=>[c,i]).filter(([c,i])=>c.k==='punish'&&c.tier===t&&!game.used.includes(i)&&!inGame.has(c.n));
  let fresh = byTier(tier);
  for(const d of [1,-1,2,-2]) if(!fresh.length) fresh = byTier(Math.max(0,Math.min(MAX_KNOTS,tier+d)));
  if(!fresh.length) fresh = CARDS.map((c,i)=>[c,i]).filter(([c])=>c.k==='punish'&&c.tier===tier);
  game.streak = 0;
  const [card,idx] = fresh[Math.floor(Math.random()*fresh.length)];
  game.used.push(idx);
  (game.stats||(game.stats={done:0,skip:0,pun:0,k0:score})).pun++;
  Sound.knot();
  const wasMax = score>=MAX_KNOTS;
  setScore(score+1);
  toast(wasMax ? 'Все 5 узлов затянуты' : '+1 узел. Теперь '+score+' из '+MAX_KNOTS);
  game.q.splice(game.i+1,0,card);
  game.i++;
  saveGame();
  render();
}

/* ---------- Таймер ---------- */
const fmt = s => Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
function setTimer(sec){
  timer = {left:sec,endAt:0,id:0,total:sec};
  const t = $('#timer');
  t.hidden = false; t.classList.remove('done');
  paintTimer('Запустить');
}
const RING = 125.66;
function paintTimer(state){
  $('#timerTime').textContent = fmt(Math.ceil(timer.left));
  $('#timerState').textContent = state;
  $('#ringFg').style.strokeDashoffset = String(RING*(1-timer.left/timer.total));
}
function toggleTimer(){
  if(!timer) return;
  unlockAudio();
  if(timer.left<=0){ timer.left=timer.total; $('#timer').classList.remove('done'); paintTimer('Запустить'); return; }
  if(timer.id) pauseTimer();
  else {
    timer.endAt = Date.now()+timer.left*1000;
    timer.id = setInterval(tick,250);
    paintTimer('Пауза');
  }
}
function tick(){
  timer.left = Math.max(0,(timer.endAt-Date.now())/1000);
  if(timer.left<=0){
    clearInterval(timer.id); timer.id=0;
    $('#timer').classList.add('done');
    paintTimer('Время вышло');
    ding();
  } else paintTimer('Пауза');
}
function pauseTimer(){
  if(timer&&timer.id){ clearInterval(timer.id); timer.id=0; paintTimer('Продолжить'); }
}
function clearTimer(){
  if(timer&&timer.id) clearInterval(timer.id);
  timer = null;
}
function unlockAudio(){
  try{
    audio = audio || new (window.AudioContext||window.webkitAudioContext)();
    if(audio.state==='suspended') audio.resume();
  }catch(e){}
}
function ding(){
  try{ navigator.vibrate && navigator.vibrate([250,120,250]); }catch(e){}
  try{
    if(!audio) return;
    [0,.35].forEach(d=>{
      const o=audio.createOscillator(), g=audio.createGain();
      o.frequency.value=660; o.connect(g); g.connect(audio.destination);
      const t=audio.currentTime+d;
      g.gain.setValueAtTime(.0001,t);
      g.gain.exponentialRampToValueAtTime(.25,t+.03);
      g.gain.exponentialRampToValueAtTime(.0001,t+.6);
      o.start(t); o.stop(t+.65);
    });
  }catch(e){}
}
async function keepAwake(){
  try{ if('wakeLock' in navigator) await navigator.wakeLock.request('screen'); }catch(e){}
}
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'&&game) keepAwake();
});

/* ---------- Печать: перевёрнутая пентаграмма с узлами на лучах и узлом в центре ---------- */
function drawSigil(){
  const R=3.9, pts=[], f=n=>n.toFixed(3);
  for(let k=0;k<5;k++){ const a=Math.PI/2+k*2*Math.PI/5; pts.push([R*Math.cos(a),R*Math.sin(a)]); }
  const circle=(x,y,r)=>`M${f(x+r)} ${f(y)} A${r} ${r} 0 1 0 ${f(x-r)} ${f(y)} A${r} ${r} 0 1 0 ${f(x+r)} ${f(y)} `;
  let d=circle(0,0,4.95)+circle(0,0,4.45);
  d+='M'+[0,2,4,1,3,0].map(i=>f(pts[i][0])+' '+f(pts[i][1])).join(' L')+' ';
  pts.forEach(([x,y])=>{ d+=circle(x*1.12,y*1.12,.5); });
  for(let k=0;k<=90;k++){
    const t=k/90*Math.PI*2, x=(Math.sin(t)+2*Math.sin(2*t))*.34, y=(-(Math.cos(t)-2*Math.cos(2*t))-.4375)*.34;
    d+=(k?'L':'M')+f(x)+' '+f(y)+' ';
  }
  $('#sigilPath').setAttribute('d',d);
}
